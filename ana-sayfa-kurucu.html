<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangi Saha - Kurucu Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen text-xs">

    <div id="founder-guard" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-2 text-white">
            <div class="font-extrabold text-sm">Kurucu Yetkisi Doğrulanıyor</div>
            <p class="text-slate-400">Lütfen bekleyin...</p>
        </div>
    </div>

    <header class="bg-white/90 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="text-base font-extrabold text-emerald-500">HANGİ SAHA</span>
                <span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-300 font-bold text-[11px]">Kurucu</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="switchSection('notes')" class="px-3 py-2 rounded-xl bg-amber-500 text-slate-950 font-extrabold">
                    <i class="fa-solid fa-note-sticky mr-1"></i> Kullanıcı Notları
                </button>
                <button onclick="switchSection('users')" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">
                    Kullanıcılar
                </button>
                <button onclick="logout()" class="px-3 py-2 rounded-xl bg-rose-600 text-white font-bold">
                    Çıkış
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- KULLANICI NOTLARI, RENK İŞARETLEME (SARI / KIRMIZI) & FİLTRELEME -->
        <section id="section-notes" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4">
            <div class="flex items-center justify-between gap-2 flex-wrap">
                <h2 class="text-sm font-extrabold">Kullanıcı Notları ve İşaretleme</h2>
                <div class="flex items-center gap-2 flex-wrap">
                    <input type="text" id="note-filter-query" oninput="renderNotesSection()" placeholder="Kullanıcı veya not ara..." class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                    <select id="note-filter-color" onchange="renderNotesSection()" class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                        <option value="">Tüm Etiketler</option>
                        <option value="yellow">Sarı (Uyarı)</option>
                        <option value="red">Kırmızı (Kritik / İhlal)</option>
                    </select>
                </div>
            </div>

            <form onsubmit="addManualUserNote(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-2.5 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                <select id="note-target-user" required class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"></select>
                <select id="note-color-select" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <option value="yellow">Sarı İşaret (Uyarı)</option>
                    <option value="red">Kırmızı İşaret (Kritik)</option>
                </select>
                <input type="text" id="note-text-input" required placeholder="Kullanıcı notu yazın..." class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                <button type="submit" class="py-2 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold">Notu Kaydet</button>
            </form>

            <div id="user-notes-list" class="space-y-2"></div>
        </section>

        <!-- KULLANICILAR, DOĞRULAMA, ENGEL / SİLME -->
        <section id="section-users" class="hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-3">
            <h2 class="text-sm font-extrabold">Kullanıcı Yönetimi</h2>
            <div id="founder-users-list" class="space-y-2"></div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            deleteDoc,
            addDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const FOUNDER_EMAIL = "eyupensarus@gmail.com";
        const LOGIN_PAGE = "index.html";

        const firebaseConfig = {
            apiKey: "AIzaSyB1-9hGJqxAwfGhLMDAdlkG9PcuojxP0ag",
            authDomain: "hangi-saha.firebaseapp.com",
            projectId: "hangi-saha",
            storageBucket: "hangi-saha.firebasestorage.app",
            messagingSenderId: "155728012356",
            appId: "1:155728012356:web:3b04ae7d8bd6f0f607c811",
            measurementId: "G-STXB4852BF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let users = [];
        let userNotes = [];

        function formatTimeTR(ts) {
            if (!ts) return "-";
            return new Date(ts).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        window.switchSection = (sec) => {
            document.getElementById("section-notes").classList.toggle("hidden", sec !== "notes");
            document.getElementById("section-users").classList.toggle("hidden", sec !== "users");
            if (sec === "notes") renderNotesSection();
            if (sec === "users") renderUsersSection();
        };

        function populateUserDropdown() {
            const sel = document.getElementById("note-target-user");
            const prev = sel.value;
            sel.innerHTML = `<option value="">Kullanıcı Seçin</option>` + users.map(u => {
                const uid = u.uid || u.id;
                return `<option value="${uid}">${u.name || "Üye"} (${u.email || uid})</option>`;
            }).join("");
            if (prev) sel.value = prev;
        }

        window.addManualUserNote = async (e) => {
            e.preventDefault();
            const uid = document.getElementById("note-target-user").value;
            const color = document.getElementById("note-color-select").value;
            const text = document.getElementById("note-text-input").value.trim();
            if (!uid || !text) return;

            const u = users.find(x => (x.uid || x.id) === uid);
            const now = Date.now();
            const detail = `Kurucu Notu (${color === "red" ? "Kırmızı" : "Sarı"}) -> ${u?.name || uid}: ${text}`;

            try {
                await addDoc(collection(db, "user_notes"), {
                    targetUserId: uid,
                    targetUserName: u?.name || "",
                    targetUserEmail: u?.email || "",
                    color,
                    source: "founder_manual",
                    text,
                    createdAt: now
                });
                await setDoc(doc(db, "users", uid, "notifications", `fnote_${now}`), {
                    id: `fnote_${now}`,
                    type: color === "red" ? "violation" : "info",
                    red: color === "red",
                    severity: color === "red" ? "critical" : "info",
                    title: color === "red" ? "Kritik Hesap Notu" : "Hesap Bilgilendirme Notu",
                    detail: text,
                    createdAt: now
                }, { merge: true });
                await addDoc(collection(db, "notifications"), {
                    type: color === "red" ? "violation" : "info",
                    red: color === "red",
                    title: "Kullanıcı Notu Eklendi",
                    detail,
                    userId: uid,
                    userName: u?.name || "",
                    createdAt: now
                });
            } catch (_) {}
            document.getElementById("note-text-input").value = "";
        };

        window.setNoteColor = async (noteId, color) => {
            try { await updateDoc(doc(db, "user_notes", noteId), { color }); } catch (_) {}
        };

        window.deleteNoteItem = async (noteId) => {
            try { await deleteDoc(doc(db, "user_notes", noteId)); } catch (_) {}
        };

        window.renderNotesSection = () => {
            const q = (document.getElementById("note-filter-query")?.value || "").trim().toLowerCase();
            const cFilter = document.getElementById("note-filter-color")?.value || "";
            const el = document.getElementById("user-notes-list");

            const list = [...userNotes]
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                .filter(n => {
                    if (cFilter && n.color !== cFilter) return false;
                    if (!q) return true;
                    return [n.targetUserName, n.targetUserEmail, n.text].join(" ").toLowerCase().includes(q);
                });

            if (!list.length) {
                el.innerHTML = `<div class="text-slate-500 text-center py-6">Not bulunamadı.</div>`;
                return;
            }

            el.innerHTML = list.map(n => {
                const isRed = n.color === "red";
                const boxCls = isRed
                    ? "bg-rose-500/10 border-rose-500/50 text-rose-900 dark:text-rose-100"
                    : "bg-amber-500/10 border-amber-500/50 text-amber-900 dark:text-amber-100";
                return `
                    <div class="p-3.5 rounded-xl border ${boxCls} flex items-start justify-between gap-3">
                        <div class="space-y-1 min-w-0 flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase ${isRed ? "bg-rose-600 text-white" : "bg-amber-400 text-slate-950"}">${isRed ? "Kırmızı" : "Sarı"}</span>
                                <span class="font-extrabold">${n.targetUserName || "Kullanıcı"}</span>
                                <span class="text-[11px] opacity-75">(${n.targetUserEmail || ""})</span>
                                <span class="text-[10px] opacity-60">${formatTimeTR(n.createdAt)}</span>
                            </div>
                            <div class="text-xs leading-relaxed">${n.text || ""}</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="setNoteColor('${n.id}', 'yellow')" class="px-2 py-1 rounded-lg bg-amber-400 text-slate-950 font-bold text-[10px]">Sarı</button>
                            <button onclick="setNoteColor('${n.id}', 'red')" class="px-2 py-1 rounded-lg bg-rose-600 text-white font-bold text-[10px]">Kırmızı</button>
                            <button onclick="deleteNoteItem('${n.id}')" class="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 font-bold text-[10px]">Sil</button>
                        </div>
                    </div>
                `;
            }).join("");
        };

        window.toggleUserBlock = async (uid) => {
            const u = users.find(x => (x.uid || x.id) === uid);
            if (!u) return;
            const nextBlocked = !(u.blocked === true);
            try {
                await updateDoc(doc(db, "users", uid), {
                    blocked: nextBlocked,
                    suspendedUntil: nextBlocked ? (Date.now() + 365 * 24 * 60 * 60 * 1000) : 0
                });
            } catch (_) {}
        };

        window.deleteUserCompletely = async (uid) => {
            try {
                await setDoc(doc(db, "deleted_sessions", uid), { uid, deletedAt: Date.now() }, { merge: true });
                await deleteDoc(doc(db, "users", uid));
            } catch (_) {}
        };

        function renderUsersSection() {
            const el = document.getElementById("founder-users-list");
            el.innerHTML = users.map(u => {
                const uid = u.uid || u.id;
                const blocked = u.blocked === true || Number(u.suspendedUntil || 0) > Date.now();
                return `
                    <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                        <div class="min-w-0">
                            <div class="font-bold truncate">${u.name || "Üye"} <span class="text-[10px] text-slate-400">(${u.role || "user"})</span></div>
                            <div class="text-[11px] text-slate-500 truncate">${u.email || ""} • ${u.phone || ""}</div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="toggleUserBlock('${uid}')" class="px-2.5 py-1 rounded-lg font-bold ${blocked ? "bg-emerald-500 text-slate-950" : "bg-amber-500/20 text-amber-600"}">${blocked ? "Engeli Kaldır" : "Engelle"}</button>
                            <button onclick="deleteUserCompletely('${uid}')" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-bold">Sil</button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        onAuthStateChanged(auth, async (user) => {
            const email = (user?.email || "").trim().toLowerCase();
            if (!user || email !== FOUNDER_EMAIL.toLowerCase()) {
                window.location.replace(LOGIN_PAGE);
                return;
            }
            document.getElementById("founder-guard").classList.add("hidden");

            onSnapshot(collection(db, "users"), (snap) => {
                users = snap.docs.map(d => ({ id: d.id, uid: d.id, ...d.data() }));
                populateUserDropdown();
                renderUsersSection();
            }, () => {});

            onSnapshot(collection(db, "user_notes"), (snap) => {
                userNotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderNotesSection();
            }, () => {});
        });

        window.logout = async () => {
            try { await signOut(auth); } catch (_) {}
            window.location.replace(LOGIN_PAGE);
        };
    </script>
</body>
</html>
