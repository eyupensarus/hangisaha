<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Oyna - Halı Saha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- ÜST BAR -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <span class="text-lg font-extrabold text-emerald-400 tracking-wide">TOP OYNA</span>
                <span id="user-badge" class="text-xs text-slate-300 bg-slate-800 px-2.5 py-1 rounded-lg">Yükleniyor...</span>
            </div>

            <div class="flex items-center gap-2">
                <button id="toggle-owner-btn" onclick="toggleOwnerMode()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition">
                    Saha Ekleme Modu: Kapalı
                </button>
                <button onclick="logout()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- DURUM MESAJI -->
        <div id="status-banner" class="text-xs px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 flex items-center justify-between">
            <span id="db-status"><i class="fa-solid fa-circle-notch fa-spin text-emerald-400 mr-1.5"></i> Veritabanına bağlanılıyor...</span>
            <span id="sync-count" class="text-emerald-400 font-semibold"></span>
        </div>

        <!-- FİLTRE VE TARİH -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Tarih</label>
                <input type="date" id="match-date" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">İlçe</label>
                <select id="filter-district" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
                    <option value="">Tümü</option>
                    <option value="Selçuklu">Selçuklu</option>
                    <option value="Meram">Meram</option>
                    <option value="Karatay">Karatay</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Saha Ara</label>
                <input type="text" id="filter-search" oninput="renderAll()" placeholder="Saha adı..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- SAHA EKLEME FORMU (AÇIKSA GÖRÜNÜR) -->
        <form id="add-pitch-form" onsubmit="addPitch(event)" class="hidden bg-slate-900 border border-emerald-500/40 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Saha Adı</label>
                <input type="text" id="pitch-name" required placeholder="Örn: Arena Halı Saha" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">İlçe</label>
                <select id="pitch-district" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
                    <option value="Selçuklu">Selçuklu</option>
                    <option value="Meram">Meram</option>
                    <option value="Karatay">Karatay</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Saatlik Ücret (₺)</label>
                <input type="number" id="pitch-price" required min="100" value="1200" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <button type="submit" id="add-pitch-btn" class="w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold rounded-xl text-sm transition">
                + Sahayı Kaydet
            </button>
        </form>

        <!-- SAHALAR LİSTESİ -->
        <div id="pitches-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <!-- KİRALADIĞIM MAÇLAR -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <h2 class="text-sm font-bold text-white mb-3">Kiralanan Maç Saatleri</h2>
            <div id="bookings-list" class="space-y-2 text-xs"></div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            deleteDoc,
            onSnapshot,
            runTransaction
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const HOURS = ["16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"];
        const LOGIN_PAGE = "index.html";

        const firebaseConfig = {
            apiKey: "AIzaSyCKYARoGK8ADJ2_T5c2GomrAG47-gHtQ-8",
            authDomain: "top-oyna-d33f3.firebaseapp.com",
            projectId: "top-oyna-d33f3",
            storageBucket: "top-oyna-d33f3.firebasestorage.app",
            messagingSenderId: "1033043310464",
            appId: "1:1033043310464:web:d467e84b68f73e99f0f365",
            measurementId: "G-P2ZRQQFFMD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let pitches = [];
        let bookings = [];
        let ownerMode = false;

        function getToday() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        document.getElementById("match-date").value = getToday();

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace(LOGIN_PAGE);
                return;
            }
            currentUser = {
                uid: user.uid,
                name: user.displayName || (user.email || "Kullanıcı").split("@")[0],
                email: user.email || ""
            };
            document.getElementById("user-badge").textContent = currentUser.name;
            startRealtimeSync();
        });

        function startRealtimeSync() {
            let pitchesReady = false;
            let bookingsReady = false;

            const updateStatus = () => {
                if (pitchesReady && bookingsReady) {
                    document.getElementById("db-status").innerHTML = `<i class="fa-solid fa-circle text-emerald-400 text-[10px] mr-1.5"></i> Canlı Veritabanı Aktif`;
                    document.getElementById("sync-count").textContent = `${pitches.length} Saha • ${bookings.length} Kiralama`;
                }
            };

            onSnapshot(collection(db, "pitches"), (snap) => {
                pitches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                pitchesReady = true;
                updateStatus();
                renderAll();
            }, (err) => {
                document.getElementById("db-status").innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-400 mr-1.5"></i> Firestore Hatası: ${err.message}`;
            });

            onSnapshot(collection(db, "bookings"), (snap) => {
                bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                bookingsReady = true;
                updateStatus();
                renderAll();
            }, (err) => {
                document.getElementById("db-status").innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-400 mr-1.5"></i> Kiralama Okuma Hatası: ${err.message}`;
            });
        }

        window.toggleOwnerMode = () => {
            ownerMode = !ownerMode;
            const btn = document.getElementById("toggle-owner-btn");
            const form = document.getElementById("add-pitch-form");
            btn.textContent = ownerMode ? "Saha Ekleme Modu: Açık" : "Saha Ekleme Modu: Kapalı";
            form.classList.toggle("hidden", !ownerMode);
        };

        window.addPitch = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const name = document.getElementById("pitch-name").value.trim();
            const district = document.getElementById("pitch-district").value;
            const price = Number(document.getElementById("pitch-price").value) || 1200;
            const btn = document.getElementById("add-pitch-btn");

            if (!name) return;
            btn.disabled = true;
            btn.textContent = "Kaydediliyor...";

            try {
                const id = `pitch_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
                await setDoc(doc(db, "pitches", id), {
                    name,
                    district,
                    price,
                    ownerId: currentUser.uid,
                    ownerName: currentUser.name,
                    createdAt: Date.now()
                });
                document.getElementById("pitch-name").value = "";
                alert("Saha kaydedildi! Diğer cihazlarda da görünecek.");
            } catch (err) {
                alert("Saha kaydedilemedi: " + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "+ Sahayı Kaydet";
            }
        };

        // 1000 kişinin aynı anda tıklamasında çakışmayı önleyen atomik kiralama
        window.rentSlot = async (pitchId, pitchName, district, price, date, hour) => {
            if (!currentUser) return;
            const slotDocId = `${pitchId}_${date}_${hour.replace(":", "")}`;
            const slotRef = doc(db, "bookings", slotDocId);

            try {
                await runTransaction(db, async (tx) => {
                    const snap = await tx.get(slotRef);
                    if (snap.exists()) {
                        throw new Error("Bu saat az önce başkası tarafından kiralandı!");
                    }
                    tx.set(slotRef, {
                        pitchId,
                        pitchName,
                        district,
                        price,
                        date,
                        hour,
                        userId: currentUser.uid,
                        userName: currentUser.name,
                        createdAt: Date.now()
                    });
                });
            } catch (err) {
                alert(err.message);
            }
        };

        window.cancelSlot = async (bookingId) => {
            try {
                await deleteDoc(doc(db, "bookings", bookingId));
            } catch (err) {
                alert("İptal edilemedi: " + err.message);
            }
        };

        window.renderAll = () => {
            const date = document.getElementById("match-date").value || getToday();
            const district = document.getElementById("filter-district").value;
            const search = document.getElementById("filter-search").value.trim().toLowerCase();

            const filtered = pitches.filter(p => {
                const okDist = !district || p.district === district;
                const okSearch = !search || (p.name || "").toLowerCase().includes(search);
                return okDist && okSearch;
            });

            const listEl = document.getElementById("pitches-list");
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="col-span-full bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-sm text-slate-400">Henüz kayıtlı saha yok. Sağ üstten <b>Saha Ekleme Modu</b>nu açıp saha ekleyebilirsin.</div>`;
            } else {
                listEl.innerHTML = filtered.map(p => {
                    const buttons = HOURS.map(h => {
                        const slotId = `${p.id}_${date}_${h.replace(":", "")}`;
                        const taken = bookings.find(b => b.id === slotId);
                        if (taken) {
                            return `<button disabled class="py-2 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-300 text-xs font-bold cursor-not-allowed">${h}<br><span class="text-[10px] font-normal">Dolu</span></button>`;
                        }
                        return `<button onclick="rentSlot('${p.id}', '${p.name.replace(/'/g, "")}', '${p.district}', ${p.price || 0}, '${date}', '${h}')" class="py-2 rounded-xl bg-emerald-950/70 hover:bg-emerald-500 text-emerald-300 hover:text-slate-950 border border-emerald-500/40 text-xs font-bold transition">${h}<br><span class="text-[10px] font-normal">Kirala</span></button>`;
                    }).join("");

                    return `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="font-bold text-white text-base">${p.name}</h3>
                                    <p class="text-xs text-slate-400">${p.district} • ${Number(p.price || 0).toLocaleString("tr-TR")} ₺</p>
                                </div>
                                <span class="text-[11px] text-slate-400">${date}</span>
                            </div>
                            <div class="grid grid-cols-4 gap-2">${buttons}</div>
                        </div>
                    `;
                }).join("");
            }

            const bookingsEl = document.getElementById("bookings-list");
            if (bookings.length === 0) {
                bookingsEl.innerHTML = `<div class="text-slate-500">Henüz kiralanmış saat yok.</div>`;
            } else {
                bookingsEl.innerHTML = bookings
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                    .map(b => `
                        <div class="flex items-center justify-between bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl">
                            <div>
                                <span class="font-bold text-white">${b.pitchName}</span>
                                <span class="text-slate-400"> • ${b.date} • </span>
                                <span class="text-emerald-400 font-bold">${b.hour}</span>
                                <span class="text-slate-400"> (${b.userName || "Üye"})</span>
                            </div>
                            ${currentUser && b.userId === currentUser.uid
                                ? `<button onclick="cancelSlot('${b.id}')" class="text-rose-400 hover:text-rose-300 font-bold">İptal</button>`
                                : `<span class="text-slate-500">Dolu</span>`
                            }
                        </div>
                    `).join("");
            }
        };

        window.logout = async () => {
            try { await signOut(auth); } catch (_) {}
            window.location.replace(LOGIN_PAGE);
        };
    </script>
</body>
</html>
