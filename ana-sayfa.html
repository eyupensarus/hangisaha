<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Oyna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body id="app-body" class="bg-slate-950 text-slate-100 min-h-screen transition-colors">

    <!-- ÜST BAR -->
    <header class="bg-slate-900/95 border-b border-slate-800 sticky top-0 z-30 backdrop-blur">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
                <span class="text-lg font-extrabold text-emerald-400 tracking-wide shrink-0">TOP OYNA</span>
                <img id="user-avatar" src="" alt="" referrerpolicy="no-referrer" class="hidden w-8 h-8 rounded-full object-cover border border-emerald-500 shrink-0">
                <span id="user-badge" class="text-xs font-semibold text-slate-200 bg-slate-800 px-2.5 py-1 rounded-lg truncate">Üye</span>
                <span id="role-badge" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shrink-0">Üye</span>
            </div>

            <!-- KÖŞEDE AÇILIR SEÇENEKLER SEKMESİ -->
            <div class="relative flex items-center gap-2">
                <button id="menu-toggle-btn" onclick="toggleOptionsMenu(event)" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-sliders"></i>
                    <span id="lbl-menu">Seçenekler</span>
                    <span id="menu-alert-dot" class="hidden w-2 h-2 rounded-full bg-rose-600"></span>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>

                <div id="options-menu" class="hidden absolute right-0 top-12 w-72 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-2 space-y-1 z-50 text-xs">
                    <button onclick="openModal('profile-modal'); closeOptionsMenu();" class="w-full px-3 py-2.5 rounded-xl hover:bg-slate-800 flex items-center justify-between text-left">
                        <span class="flex items-center gap-2.5"><i class="fa-solid fa-user-pen text-emerald-400 w-4"></i> <span id="lbl-profile">Profil & Telefon</span></span>
                    </button>

                    <div id="founder-menu-items" class="hidden space-y-1 pt-1 border-t border-slate-800">
                        <button onclick="togglePanel('notifications-panel'); closeOptionsMenu();" class="w-full px-3 py-2.5 rounded-xl hover:bg-slate-800 flex items-center justify-between text-left">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-bell text-amber-400 w-4"></i> <span id="lbl-notif">Bildirim & Onay</span></span>
                            <span id="notif-count" class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold text-[10px]">0</span>
                        </button>
                        <button onclick="togglePanel('users-panel'); closeOptionsMenu();" class="w-full px-3 py-2.5 rounded-xl hover:bg-slate-800 flex items-center justify-between text-left">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-users-gear text-sky-400 w-4"></i> <span id="lbl-users">Kullanıcı Yönetimi</span></span>
                            <span id="users-count" class="px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 font-bold text-[10px]">0</span>
                        </button>
                    </div>

                    <div id="owner-menu-items" class="hidden space-y-1 pt-1 border-t border-slate-800">
                        <button onclick="toggleAddPitchForm(); closeOptionsMenu();" class="w-full px-3 py-2.5 rounded-xl hover:bg-slate-800 flex items-center gap-2.5 text-left text-emerald-300 font-semibold">
                            <i class="fa-solid fa-plus-circle w-4"></i> <span id="lbl-add-pitch">Saha Ekle</span>
                        </button>
                    </div>

                    <div class="pt-1 border-t border-slate-800 grid grid-cols-2 gap-1.5 px-1 py-1">
                        <button onclick="toggleTheme()" class="px-2.5 py-2 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 flex items-center justify-center gap-1.5 font-semibold">
                            <i id="theme-icon" class="fa-solid fa-moon text-amber-300"></i> <span id="lbl-theme">Tema</span>
                        </button>
                        <button onclick="toggleLanguage()" class="px-2.5 py-2 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 flex items-center justify-center gap-1.5 font-semibold">
                            <i class="fa-solid fa-globe text-sky-400"></i> <span id="lang-badge">TR</span>
                        </button>
                    </div>

                    <div class="pt-1 border-t border-slate-800 space-y-1">
                        <a href="index.html" class="w-full px-3 py-2 rounded-xl hover:bg-slate-800 flex items-center gap-2.5 text-slate-300">
                            <i class="fa-solid fa-arrow-right-to-bracket text-slate-400 w-4"></i> <span id="lbl-login-page">Giriş Ekranı</span>
                        </a>
                        <button onclick="logout()" class="w-full px-3 py-2 rounded-xl hover:bg-rose-950/60 text-rose-300 flex items-center gap-2.5 font-semibold text-left">
                            <i class="fa-solid fa-right-from-bracket w-4"></i> <span id="lbl-logout">Çıkış Yap</span>
                        </button>
                        <button onclick="deleteOwnAccountRecord()" class="w-full px-3 py-2 rounded-xl hover:bg-rose-950/60 text-rose-400 flex items-center gap-2.5 text-left">
                            <i class="fa-solid fa-user-slash w-4"></i> <span id="lbl-delete-acc">Hesabı Sil</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-5">

        <!-- ENGEL UYARISI -->
        <div id="blocked-banner" class="hidden p-3.5 rounded-2xl bg-rose-950/80 border border-rose-500 text-rose-200 text-xs font-bold">
            <i class="fa-solid fa-ban text-rose-400 mr-1.5"></i> <span id="lbl-blocked">Hesap kısıtlı.</span>
        </div>

        <!-- DURUM ŞERİDİ -->
        <div class="text-xs px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 flex items-center justify-between flex-wrap gap-2">
            <span><i class="fa-solid fa-circle text-emerald-400 text-[9px] mr-1.5"></i> <span id="lbl-live">Canlı</span></span>
            <span id="sync-count" class="text-emerald-400 font-semibold"></span>
        </div>

        <!-- KURUCU BİLDİRİM & ONAY MERKEZİ -->
        <section id="notifications-panel" class="hidden bg-slate-900 border border-amber-500/40 rounded-2xl p-4 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-amber-300 flex items-center gap-2">
                    <i class="fa-solid fa-bell"></i> <span id="lbl-notif-title">Bildirim & Onay</span>
                </h2>
                <button onclick="togglePanel('notifications-panel')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="activity-feed-list" class="space-y-1.5 text-xs max-h-44 overflow-y-auto"></div>
            <div id="approval-queue-list" class="space-y-2 text-xs"></div>
        </section>

        <!-- KURUCU KULLANICI YÖNETİMİ -->
        <section id="users-panel" class="hidden bg-slate-900 border border-sky-500/40 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-sky-300 flex items-center gap-2">
                    <i class="fa-solid fa-users-gear"></i> <span id="lbl-users-title">Kullanıcılar</span>
                </h2>
                <button onclick="togglePanel('users-panel')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="users-list" class="space-y-2 text-xs"></div>
        </section>

        <!-- SAHA SAHİBİ PANELİ -->
        <section id="owner-dashboard" class="hidden bg-slate-900 border border-emerald-500/30 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <h2 class="text-sm font-bold text-emerald-300 flex items-center gap-2">
                    <i class="fa-solid fa-futbol"></i> <span id="lbl-my-pitches">Sahalarım</span>
                </h2>
                <button onclick="toggleAddPitchForm()" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">
                    + <span id="lbl-add-pitch-btn">Saha Ekle</span>
                </button>
            </div>
            <div id="owner-pitches-summary" class="flex flex-wrap gap-2 text-xs"></div>
        </section>

        <!-- FİLTRE VE ARAMA -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-4 gap-3">
            <div>
                <label class="block text-[11px] text-slate-400 mb-1" id="lbl-date">Tarih</label>
                <input type="date" id="match-date" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1" id="lbl-district">İlçe</label>
                <select id="filter-district" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
                    <option value="">Tümü</option>
                    <option value="Selçuklu">Selçuklu</option>
                    <option value="Meram">Meram</option>
                    <option value="Karatay">Karatay</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1" id="lbl-search-name">Saha Ara</label>
                <input type="text" id="filter-search" oninput="renderAll()" placeholder="Saha adı..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1" id="lbl-search-addr">Adres Ara</label>
                <input type="text" id="filter-address" oninput="renderAll()" placeholder="Cadde / Mahalle..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- SAHA EKLEME FORMU -->
        <form id="add-pitch-form" onsubmit="addPitch(event)" class="hidden bg-slate-900 border border-emerald-500/40 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-5 gap-3 items-end">
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Saha Adı</label>
                <input type="text" id="pitch-name" required placeholder="Arena Halı Saha" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">İlçe</label>
                <select id="pitch-district" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
                    <option value="Selçuklu">Selçuklu</option>
                    <option value="Meram">Meram</option>
                    <option value="Karatay">Karatay</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Adres</label>
                <input type="text" id="pitch-address" required placeholder="Yazır Mah. ..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Ücret (₺)</label>
                <input type="number" id="pitch-price" required min="100" value="1200" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <button type="submit" id="add-pitch-btn" class="w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold rounded-xl text-sm transition">
                Kaydet
            </button>
        </form>

        <!-- LEJAND -->
        <div class="flex items-center gap-4 text-xs text-slate-400 flex-wrap">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-500/40 border border-emerald-500 inline-block"></span> <span id="leg-free">Müsait</span></span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-rose-600/80 border border-rose-400 inline-block"></span> <span id="leg-mine">Senin</span></span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-600/70 border border-slate-400 inline-block"></span> <span id="leg-taken">Dolu</span></span>
        </div>

        <!-- SAHALAR -->
        <div id="pitches-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <!-- REZERVASYONLAR -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <h2 class="text-sm font-bold text-white mb-3" id="lbl-bookings">Rezervasyonlar</h2>
            <div id="bookings-list" class="space-y-2 text-xs"></div>
        </div>
    </main>

    <!-- TEYİT MODALI (SEÇİM & İPTAL) -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4 shadow-2xl">
            <h3 id="confirm-title" class="text-sm font-extrabold text-white">Teyit</h3>
            <div id="confirm-body" class="text-xs text-slate-300 bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1"></div>
            <div class="flex items-center justify-end gap-2">
                <button onclick="closeConfirmModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs">Vazgeç</button>
                <button id="confirm-ok-btn" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs">Onayla</button>
            </div>
        </div>
    </div>

    <!-- PROFİL & TELEFON MODALI -->
    <div id="profile-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-white" id="lbl-profile-modal">Profil & Telefon</h3>
                <button onclick="closeModal('profile-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveProfile(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Ad Soyad</label>
                    <input type="text" id="prof-name" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Telefon</label>
                    <input type="tel" id="prof-phone" placeholder="05xx xxx xx xx" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Fotoğraf URL</label>
                    <input type="url" id="prof-photo" placeholder="https://..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-emerald-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('profile-modal')" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold">İptal</button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, addDoc, onSnapshot, runTransaction
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const HOURS = ["16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"];
        const LOGIN_PAGE = "index.html";
        const FOUNDER_EMAIL = "eyupensarus@gmail.com";

        const KEYS = {
            archive: "top_oyna_archived_users_v1",
            pitches: "top_oyna_pitches_v1",
            bookings: "top_oyna_bookings_v1",
            activities: "top_oyna_activities_v1",
            lang: "top_oyna_lang_v1",
            theme: "top_oyna_theme_v1"
        };

        const I18N = {
            tr: {
                menu: "Seçenekler", profile: "Profil & Telefon", notif: "Bildirim & Onay", users: "Kullanıcı Yönetimi",
                addPitch: "Saha Ekle", theme: "Tema", loginPage: "Giriş Ekranı", logout: "Çıkış Yap", deleteAcc: "Hesabı Sil",
                blocked: "Hesap kısıtlı.", live: "Canlı", myPitches: "Sahalarım", date: "Tarih", district: "İlçe",
                searchName: "Saha Ara", searchAddr: "Adres Ara", free: "Müsait", mine: "Senin", taken: "Dolu",
                bookings: "Rezervasyonlar", founder: "Kurucu", manager: "Saha Sahibi", member: "Üye"
            },
            en: {
                menu: "Options", profile: "Profile & Phone", notif: "Alerts & Approvals", users: "User Control",
                addPitch: "Add Pitch", theme: "Theme", loginPage: "Login", logout: "Sign Out", deleteAcc: "Delete Account",
                blocked: "Account restricted.", live: "Live", myPitches: "My Pitches", date: "Date", district: "District",
                searchName: "Search Pitch", searchAddr: "Search Address", free: "Open", mine: "Yours", taken: "Booked",
                bookings: "Bookings", founder: "Founder", manager: "Pitch Owner", member: "Member"
            }
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCKYARoGK8ADJ2_T5c2GomrAG47-gHtQ-8",
            authDomain: "top-oyna-d33f3.firebaseapp.com",
            projectId: "top-oyna-d33f3",
            storageBucket: "top-oyna-d33f3.firebasestorage.app",
            messagingSenderId: "1033043310464",
            appId: "1:1033043310464:web:d467e84b68f73e99f0f365",
            measurementId: "G-P2ZRQQFFMD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = {
            uid: "guest_user",
            name: "Üye",
            email: "",
            phone: "",
            photo: "",
            blocked: false,
            role: "user"
        };

        let lang = localStorage.getItem(KEYS.lang) || "tr";
        let theme = localStorage.getItem(KEYS.theme) || "dark";
        let pitches = [];
        let bookings = [];
        let users = [];
        let archivedUsers = [];
        let approvalRequests = [];
        let activities = [];
        let pendingConfirmFn = null;

        function readList(key, fallback = []) {
            try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; } catch (_) { return fallback; }
        }
        function writeList(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
        }
        function getToday() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }
        function fmtTime(ts) {
            if (!ts) return "-";
            return new Date(ts).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }
        function isFounder() {
            return Boolean(currentUser?.email && currentUser.email.toLowerCase() === FOUNDER_EMAIL.toLowerCase());
        }
        function isPitchOwner() {
            return Boolean(currentUser?.role === "manager" && !isFounder());
        }
        function canEditPitch(pitch) {
            if (isFounder()) return true;
            if (isPitchOwner()) return pitch.ownerId === currentUser.uid || pitch.ownerId === "system";
            return false;
        }

        function applyTheme() {
            const html = document.documentElement;
            const body = document.getElementById("app-body");
            const icon = document.getElementById("theme-icon");
            if (theme === "light") {
                html.classList.remove("dark");
                body.className = "bg-slate-100 text-slate-900 min-h-screen transition-colors";
                icon.className = "fa-solid fa-sun text-amber-500";
            } else {
                html.classList.add("dark");
                body.className = "bg-slate-950 text-slate-100 min-h-screen transition-colors";
                icon.className = "fa-solid fa-moon text-amber-300";
            }
            localStorage.setItem(KEYS.theme, theme);
        }

        function applyLang() {
            const t = I18N[lang] || I18N.tr;
            document.documentElement.lang = lang;
            document.getElementById("lang-badge").textContent = lang.toUpperCase();
            const map = {
                "lbl-menu": t.menu, "lbl-profile": t.profile, "lbl-notif": t.notif, "lbl-users": t.users,
                "lbl-add-pitch": t.addPitch, "lbl-theme": t.theme, "lbl-login-page": t.loginPage,
                "lbl-logout": t.logout, "lbl-delete-acc": t.deleteAcc, "lbl-blocked": t.blocked,
                "lbl-live": t.live, "lbl-my-pitches": t.myPitches, "lbl-date": t.date,
                "lbl-district": t.district, "lbl-search-name": t.searchName, "lbl-search-addr": t.searchAddr,
                "leg-free": t.free, "leg-mine": t.mine, "leg-taken": t.taken, "lbl-bookings": t.bookings,
                "lbl-add-pitch-btn": t.addPitch, "lbl-profile-modal": t.profile
            };
            Object.entries(map).forEach(([id, val]) => {
                const el = document.getElementById(id);
                if (el) el.textContent = val;
            });
            updateRoleUI();
            renderAll();
        }

        window.toggleTheme = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); };
        window.toggleLanguage = () => { lang = lang === "tr" ? "en" : "tr"; localStorage.setItem(KEYS.lang, lang); applyLang(); };

        window.toggleOptionsMenu = (e) => {
            e.stopPropagation();
            document.getElementById("options-menu").classList.toggle("hidden");
        };
        window.closeOptionsMenu = () => document.getElementById("options-menu").classList.add("hidden");
        document.addEventListener("click", (e) => {
            const menu = document.getElementById("options-menu");

            const list = readList(KEYS.archive, []);
            const idx = list.findIndex(x => x.uid === rec.uid || (rec.email && x.email === rec.email));
            if (idx >= 0) list[idx] = { ...list[idx], ...rec, updatedAt: Date.now() };
            else list.unshift({ ...rec, updatedAt: Date.now() });
            writeList(KEYS.archive, list);
            archivedUsers = list;
        }

                requesterName: currentUser.name,
                requesterEmail: currentUser.email,

                createdAt: Date.now()

        async function syncUserOnLogin(user) {
            const g = Array.isArray(user.providerData) ? user.providerData.find(p => p?.providerId === "google.com") : null;
            const name = g?.displayName || user.displayName || (user.email || "Üye").split("@")[0];
            const email = g?.email || user.email || "";
            const googlePhoto = g?.photoURL || user.photoURL || "";

            let existing = {};
            try {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) existing = snap.data();
            } catch (_) {}

            const record = {
                uid: user.uid,
                name: existing.name || name,
                email,
                phone: existing.phone || "",
                photo: existing.photo || googlePhoto,
                blocked: Boolean(existing.blocked),
                role: existing.role === "manager" ? "manager" : "user",
                lastLoginAt: Date.now(),
                deletedOrSignedOut: false
            };

            currentUser = record;
            saveLocalArchive(record);
            try {
                await setDoc(doc(db, "users", user.uid), record, { merge: true });
                await setDoc(doc(db, "archived_users", user.uid), { ...record, archivedAt: Date.now() }, { merge: true });
            } catch (_) {}

            updateRoleUI();
            renderAll();
            renderPanels();
        }

        activities = readList(KEYS.activities, []);
        pitches = readList(KEYS.pitches, [
            { id: "pitch_selcuklu_1", name: "Selçuklu Arena", district: "Selçuklu", address: "Yazır Mah. Real Cad.", price: 1400, ownerId: "system" },
            { id: "pitch_meram_1", name: "Meram Yıldız", district: "Meram", address: "Yeni Meram Cad.", price: 1300, ownerId: "system" }
        ]);
        bookings = readList(KEYS.bookings, []);

        applyTheme();
        applyLang();

        onAuthStateChanged(auth, async (user) => {
            if (user) await syncUserOnLogin(user);
            else { updateRoleUI(); renderAll(); }
            startSync();
        });

        function getMergedUsers() {
            const map = new Map();
            [...archivedUsers, ...users].forEach(u => {
                const key = u.uid || u.id || u.email;
                if (!key) return;
                const prev = map.get(key) || {};
                map.set(key, { ...prev, ...u, uid: u.uid || u.id || prev.uid, lastLoginAt: Math.max(prev.lastLoginAt || 0, u.lastLoginAt || 0) });
            });
            return Array.from(map.values()).sort((a, b) => (b.lastLoginAt || 0) - (a.lastLoginAt || 0));
        }

        function startSync() {
            const refreshCount = () => {
                document.getElementById("sync-count").textContent = `${pitches.length} • ${bookings.length} • ${getMergedUsers().length}`;
            };
            refreshCount();
            renderAll();
            renderPanels();

            onSnapshot(collection(db, "pitches"), (snap) => {
                if (!snap.empty) { pitches = snap.docs.map(d => ({ id: d.id, ...d.data() })); writeList(KEYS.pitches, pitches); }
                refreshCount(); renderAll();
            }, () => {});

            onSnapshot(collection(db, "bookings"), (snap) => {
                if (!snap.empty) { bookings = snap.docs.map(d => ({ id: d.id, ...d.data() })); writeList(KEYS.bookings, bookings); }
                refreshCount(); renderAll();
            }, () => {});

            onSnapshot(collection(db, "users"), (snap) => {
                users = snap.docs.map(d => ({ id: d.id, uid: d.id, ...d.data() }));
                users.forEach(saveLocalArchive);
                const me = users.find(u => u.uid === currentUser.uid);
                if (me) {
                    currentUser = { ...currentUser, blocked: Boolean(me.blocked), role: me.role === "manager" ? "manager" : "user", phone: me.phone || currentUser.phone, photo: me.photo || currentUser.photo };
                    updateRoleUI();
                }
                refreshCount(); renderPanels(); renderAll();
            }, () => {});

            onSnapshot(collection(db, "archived_users"), (snap) => {
                const remote = snap.docs.map(d => ({ id: d.id, uid: d.id, ...d.data() }));
                const map = new Map();
                [...readList(KEYS.archive, []), ...remote].forEach(x => {
                    const k = x.uid || x.id || x.email;
                    if (k) map.set(k, { ...(map.get(k) || {}), ...x });
                });
                archivedUsers = Array.from(map.values());
                writeList(KEYS.archive, archivedUsers);
                refreshCount(); renderPanels();
            }, () => {});

            onSnapshot(collection(db, "approval_requests"), (snap) => {
                approvalRequests = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderPanels();
            }, () => {});

            onSnapshot(collection(db, "activities"), (snap) => {
                if (!snap.empty) {
                    activities = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 50);
                    writeList(KEYS.activities, activities);
                }
                renderPanels();
            }, () => {});
        }

            const pending = approvalRequests.filter(r => r.status === "pending");

            document.getElementById("users-count").textContent = String(merged.length);

            const feedEl = document.getElementById("activity-feed-list");

                : `<div class="text-slate-500">-</div>`;

            appEl.innerHTML = pending.length

                        <div><span class="font-bold text-amber-300">${r.requesterName}:</span> <span class="text-slate-200">${r.summary}</span></div>
                        <div class="flex gap-1.5">

            const usersEl = document.getElementById("users-list");

                            <div class="text-[11px] text-slate-500">${isMgr ? "Saha Sahibi" : "Üye"} ${isBlk ? "• Engelli" : ""} • ${fmtTime(u.lastLoginAt)}</div>
                        </div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <button onclick="changeUserRole('${uid}', '${isMgr ? "user" : "manager"}')" class="px-2.5 py-1 rounded-lg bg-sky-500/20 text-sky-300 border border-sky-500/40 font-bold text-[11px]">
                                ${isMgr ? "Üye Yap" : "Saha Sahibi Yap"}
                            </button>
                            ${!isMe ? `
                                <button onclick="toggleUserBlock('${uid}', ${!isBlk})" class="px-2.5 py-1 rounded-lg ${isBlk ? "bg-emerald-600 text-white" : "bg-amber-500/20 text-amber-300 border border-amber-500/40"} font-bold text-[11px]">
                                    ${isBlk ? "Engeli Kaldır" : "Engelle"}
                                </button>
                                <button onclick="adminDeleteUser('${uid}')" class="px-2.5 py-1 rounded-lg bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/40 font-bold text-[11px]">
                                    Sil
                                </button>

                        </div>
                    </div>`;
            }).join("");
        }

        window.changeUserRole = async (uid, role) => {
            if (!isFounder()) return;
            if (uid === currentUser.uid) { currentUser.role = role; updateRoleUI(); }
            const list = readList(KEYS.archive, []).map(u => (u.uid === uid || u.id === uid) ? { ...u, role } : u);
            writeList(KEYS.archive, list); archivedUsers = list;
            try {

                await setDoc(doc(db, "archived_users", uid), { role }, { merge: true });

        window.toggleUserBlock = async (uid, blocked) => {
            if (!isFounder()) return;
            const list = readList(KEYS.archive, []).map(u => (u.uid === uid || u.id === uid) ? { ...u, blocked } : u);
            writeList(KEYS.archive, list); archivedUsers = list;
            try {
                await setDoc(doc(db, "users", uid), { blocked }, { merge: true });
                await setDoc(doc(db, "archived_users", uid), { blocked }, { merge: true });

        window.adminDeleteUser = async (uid) => {
            if (!isFounder()) return;
            const list = readList(KEYS.archive, []).map(u => (u.uid === uid || u.id === uid) ? { ...u, deletedOrSignedOut: true } : u);
            writeList(KEYS.archive, list); archivedUsers = list;
            try {

        window.resolveApproval = async (reqId, ok) => {
            if (!isFounder()) return;
            const req = approvalRequests.find(r => r.id === reqId);
            if (!req) return;
            if (ok) {
                const p = req.payload || {};
                try {
                    if (req.actionType === "create_pitch") {
                        const id = p.id || `pitch_${Date.now()}`;
                        const item = { id, ...p, createdAt: Date.now() };
                        pitches = [item, ...pitches]; writeList(KEYS.pitches, pitches);
                        await setDoc(doc(db, "pitches", id), item);
                    } else if (req.actionType === "delete_pitch") {
                        pitches = pitches.filter(x => x.id !== p.pitchId); writeList(KEYS.pitches, pitches);
                        await deleteDoc(doc(db, "pitches", p.pitchId));
                    } else if (req.actionType === "update_pitch") {
                        pitches = pitches.map(x => x.id === p.pitchId ? { ...x, name: p.name, address: p.address, price: Number(p.price) } : x);
                        writeList(KEYS.pitches, pitches);
                        await updateDoc(doc(db, "pitches", p.pitchId), { name: p.name, address: p.address, price: Number(p.price) });
                    } else if (req.actionType === "cancel_booking") {
                        bookings = bookings.filter(x => x.id !== p.bookingId); writeList(KEYS.bookings, bookings);
                        await deleteDoc(doc(db, "bookings", p.bookingId));
                    }
                } catch (_) {}
            }
            const nextStatus = ok ? "approved" : "rejected";
            approvalRequests = approvalRequests.map(r => r.id === reqId ? { ...r, status: nextStatus } : r);
            try { await updateDoc(doc(db, "approval_requests", reqId), { status: nextStatus }); } catch (_) {}
            await logFounderActivity(`${ok ? "Onaylandı" : "Reddedildi"}: ${req.summary}`);
            renderPanels(); renderAll();
        };

        window.addPitch = async (e) => {
            e.preventDefault();
            if (currentUser.blocked || (!isFounder() && !isPitchOwner())) return;
            const name = document.getElementById("pitch-name").value.trim();
            const district = document.getElementById("pitch-district").value;
            const address = document.getElementById("pitch-address").value.trim();
            const price = Number(document.getElementById("pitch-price").value) || 1200;
            const payload = { id: `pitch_${Date.now()}`, name, district, address, price, ownerId: currentUser.uid };

            if (isPitchOwner()) {
                await queueApproval("create_pitch", `Saha ekleme: ${name} (${district}, ${price}₺)`, payload);
                e.target.reset();
                document.getElementById("add-pitch-form").classList.add("hidden");
                return;
            }

            pitches = [payload, ...pitches]; writeList(KEYS.pitches, pitches);
            try { await setDoc(doc(db, "pitches", payload.id), payload); } catch (_) {}
            await logFounderActivity(`Saha eklendi: ${name}`);
            e.target.reset();
            document.getElementById("add-pitch-form").classList.add("hidden");
            renderAll();
        };

        window.editPitchAction = async (pitchId) => {
            const p = pitches.find(x => x.id === pitchId);
            if (!p || !canEditPitch(p)) return;
            const name = prompt("Saha Adı:", p.name);
            if (!name?.trim()) return;
            const address = prompt("Adres:", p.address || "");
            const price = Number(prompt("Ücret (₺):", p.price || 1200)) || p.price;

            if (isPitchOwner()) {
                await queueApproval("update_pitch", `Saha düzenleme: ${name.trim()} (${price}₺)`, { pitchId, name: name.trim(), address: (address || "").trim(), price });
                return;
            }
            pitches = pitches.map(x => x.id === pitchId ? { ...x, name: name.trim(), address: (address || "").trim(), price } : x);
            writeList(KEYS.pitches, pitches);
            try { await updateDoc(doc(db, "pitches", pitchId), { name: name.trim(), address: (address || "").trim(), price }); } catch (_) {}
            await logFounderActivity(`Saha güncellendi: ${name.trim()}`);
            renderAll();
        };

        window.deletePitchAction = async (pitchId, pitchName) => {
            const p = pitches.find(x => x.id === pitchId);
            if (!p || !canEditPitch(p)) return;
            if (isPitchOwner()) {
                await queueApproval("delete_pitch", `Saha silme: ${pitchName}`, { pitchId, pitchName });
                return;
            }
            openConfirm("Saha Sil", [`<b>${pitchName}</b>`], async () => {
                pitches = pitches.filter(x => x.id !== pitchId); writeList(KEYS.pitches, pitches);
                try { await deleteDoc(doc(db, "pitches", pitchId)); } catch (_) {}
                await logFounderActivity(`Saha silindi: ${pitchName}`);
                renderAll();
            });
        };

        window.handleSlotClick = (pitchId, pitchName, district, address, price, date, hour, existingId, existingUserId) => {
            if (currentUser.blocked) return;

            if (existingId) {
                const isMine = existingUserId === currentUser.uid;
                if (!isMine && !isFounder() && !isPitchOwner()) return;
                openConfirm(
                    "İptal Teyidi",
                    [`<b>${pitchName}</b>`, `${date} • ${hour}`],
                    async () => {
                        if (isPitchOwner() && !isMine) {
                            await queueApproval("cancel_booking", `Rezervasyon iptal: ${pitchName} (${date} ${hour})`, { bookingId: existingId });
                            return;
                        }
                        bookings = bookings.filter(b => b.id !== existingId);
                        writeList(KEYS.bookings, bookings);
                        try { await deleteDoc(doc(db, "bookings", existingId)); } catch (_) {}
                        await logFounderActivity(`İptal: ${currentUser.name} - ${pitchName} (${date} ${hour})`);
                        renderAll();
                    }
                );
                return;
            }

            if (bookings.some(b => b.userId === currentUser.uid && b.date === date)) return;

            openConfirm(
                "Rezervasyon Teyidi",
                [`<b>${pitchName}</b>`, `${district} • ${address || ""}`, `${date} • ${hour} • ${Number(price).toLocaleString("tr-TR")} ₺`],
                async () => {
                    const slotId = `${pitchId}_${date}_${hour.replace(":", "")}`;
                    if (bookings.some(b => b.id === slotId)) return;
                    const rec = {
                        id: slotId, pitchId, pitchName, district, address: address || "", price, date, hour,
                        userId: currentUser.uid, userName: currentUser.name, userEmail: currentUser.email, userPhone: currentUser.phone || "",
                        createdAt: Date.now()
                    };
                    bookings = [rec, ...bookings];
                    writeList(KEYS.bookings, bookings);
                    try {
                        const ref = doc(db, "bookings", slotId);
                        await runTransaction(db, async (tx) => {
                            const snap = await tx.get(ref);
                            if (!snap.exists()) tx.set(ref, rec);
                        });
                    } catch (_) {}
                    await logFounderActivity(`Rezervasyon: ${currentUser.name} - ${pitchName} (${date} ${hour})`);
                    renderAll();
                }
            );
        };

        window.renderAll = () => {
            const date = document.getElementById("match-date").value || getToday();
            const district = document.getElementById("filter-district").value;
            const search = document.getElementById("filter-search").value.trim().toLowerCase();
            const addrSearch = document.getElementById("filter-address").value.trim().toLowerCase();
            const isBlocked = Boolean(currentUser.blocked);
            const hasDayBooking = bookings.some(b => b.userId === currentUser.uid && b.date === date);

            const ownerSummary = document.getElementById("owner-pitches-summary");
            if (ownerSummary) {
                const minePitches = pitches.filter(canEditPitch);
                ownerSummary.innerHTML = minePitches.map(p => `<span class="px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800 text-slate-200">${p.name} (${p.price}₺)</span>`).join("");
            }

            const filtered = pitches.filter(p => {
                const okDist = !district || p.district === district;
                const okName = !search || (p.name || "").toLowerCase().includes(search);
                const okAddr = !addrSearch || (p.address || "").toLowerCase().includes(addrSearch) || (p.district || "").toLowerCase().includes(addrSearch);
                return okDist && okName && okAddr;
            });

            const listEl = document.getElementById("pitches-list");
            listEl.innerHTML = filtered.map(p => {
                const canManage = canEditPitch(p);
                const buttons = HOURS.map(h => {
                    const slotId = `${p.id}_${date}_${h.replace(":", "")}`;
                    const taken = bookings.find(b => b.id === slotId);
                    if (taken) {
                        const isMine = taken.userId === currentUser.uid;
                        const canCancel = isMine || isFounder() || isPitchOwner();
                        if (isMine) {
                            return `<button onclick="handleSlotClick('${p.id}','${(p.name || "").replace(/'/g, "")}','${p.district}','${(p.address || "").replace(/'/g, "")}',${p.price || 0},'${date}','${h}','${taken.id}','${taken.userId}')" class="py-2 rounded-xl bg-rose-600/85 hover:bg-rose-500 border border-rose-400 text-white text-xs font-bold transition">${h}<br><span class="text-[10px]">İptal</span></button>`;
                        }
                        return `<button ${canCancel && !isBlocked ? `onclick="handleSlotClick('${p.id}','${(p.name || "").replace(/'/g, "")}','${p.district}','${(p.address || "").replace(/'/g, "")}',${p.price || 0},'${date}','${h}','${taken.id}','${taken.userId}')"` : "disabled"} class="py-2 rounded-xl bg-slate-700/70 border border-slate-500 text-slate-200 text-xs font-bold ${canCancel && !isBlocked ? "hover:bg-slate-600" : "cursor-not-allowed"}">${h}<br><span class="text-[10px]">Dolu</span></button>`;
                    }
                    if (isBlocked || hasDayBooking) {
                        return `<button disabled class="py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-600 text-xs font-bold cursor-not-allowed">${h}<br><span class="text-[10px]">-</span></button>`;
                    }
                    return `<button onclick="handleSlotClick('${p.id}','${(p.name || "").replace(/'/g, "")}','${p.district}','${(p.address || "").replace(/'/g, "")}',${p.price || 0},'${date}','${h}','','')" class="py-2 rounded-xl bg-emerald-950/70 hover:bg-emerald-500 text-emerald-300 hover:text-slate-950 border border-emerald-500/40 text-xs font-bold transition">${h}</button>`;
                }).join("");

                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <h3 class="font-bold text-white text-base">${p.name}</h3>
                                <p class="text-xs text-slate-400">${p.district} • ${p.address || "-"} • <span class="text-emerald-400 font-bold">${Number(p.price || 0).toLocaleString("tr-TR")} ₺</span></p>
                            </div>
                            ${canManage ? `
                                <div class="flex items-center gap-1.5">
                                    <button onclick="editPitchAction('${p.id}')" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-sky-300 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deletePitchAction('${p.id}','${(p.name || "").replace(/'/g, "")}')" class="px-2 py-1 rounded-lg bg-rose-950/80 hover:bg-rose-600 text-rose-300 hover:text-white text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>` : ""}
                        </div>
                        <div class="grid grid-cols-4 gap-2">${buttons}</div>
                    </div>`;
            }).join("");

            const bookingsEl = document.getElementById("bookings-list");
            const canSeeHolder = isFounder() || isPitchOwner();
            bookingsEl.innerHTML = bookings.length
                ? bookings.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(b => {
                    const isMine = b.userId === currentUser.uid;
                    const holder = canSeeHolder ? ` • ${b.userName || ""} ${b.userPhone ? `(${b.userPhone})` : ""}` : (isMine ? ` • ${b.userName}` : "");
                    return `
                        <div class="flex items-center justify-between bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl gap-2">
                            <div class="truncate"><span class="font-bold text-white">${b.pitchName}</span> <span class="text-slate-400">${b.date} • ${b.hour}${holder}</span></div>
                            ${(isMine || canSeeHolder) && !isBlocked
                                ? `<button onclick="handleSlotClick('${b.pitchId}','${b.pitchName}','${b.district}','',${b.price || 0},'${b.date}','${b.hour}','${b.id}','${b.userId}')" class="text-rose-400 hover:text-rose-300 font-bold shrink-0">İptal</button>`
                                : `<span class="text-slate-500 shrink-0">Dolu</span>`}
                        </div>`;
                }).join("")
                : `<div class="text-slate-500">-</div>`;
        };

        window.logout = async () => {
            if (currentUser.uid !== "guest_user") {
                const rec = { ...currentUser, deletedOrSignedOut: true, signedOutAt: Date.now() };
                saveLocalArchive(rec);
                try { await setDoc(doc(db, "archived_users", currentUser.uid), rec, { merge: true }); } catch (_) {}
            }
            try { await signOut(auth); } catch (_) {}
            window.location.replace(LOGIN_PAGE);
        };

        window.deleteOwnAccountRecord = async () => {
            if (currentUser.uid === "guest_user") return;
            openConfirm("Hesabı Sil", [currentUser.email || currentUser.name], async () => {
                const rec = { ...currentUser, deletedOrSignedOut: true, deletedAt: Date.now() };
                saveLocalArchive(rec);
                try {
                    await setDoc(doc(db, "archived_users", currentUser.uid), rec, { merge: true });
                    await deleteDoc(doc(db, "users", currentUser.uid));
                    if (auth.currentUser) await deleteUser(auth.currentUser);
                } catch (_) {
                    try { await signOut(auth); } catch (_) {}
                }
                window.location.replace(LOGIN_PAGE);
            });
        };
    </script>
</body>
</html>
