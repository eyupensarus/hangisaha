<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Oyna - Kurucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { transition: background-color 0.2s, color 0.2s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">

    <!-- ÜST BAR -->
    <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <a href="#top" onclick="resetHomeView()" class="flex items-center gap-2.5 group">
                <div class="w-8 h-8 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-black text-sm shadow-sm group-hover:scale-105 transition">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <span class="text-lg font-extrabold tracking-tight text-emerald-600 dark:text-emerald-400">TOP OYNA</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-300 border border-amber-500/30">Site Sahibi</span>
            </a>

            <div class="flex items-center gap-2 relative">
                <button onclick="openDrawerTab('notifications')" class="relative px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-bell text-amber-500"></i>
                    <span class="hidden sm:inline">Bildirimler</span>
                    <span id="founder-notif-badge" class="hidden min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-extrabold flex items-center justify-center">0</span>
                </button>

                <button id="corner-menu-btn" onclick="toggleCornerMenu(event)" class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition">
                    <img id="header-avatar" src="https://ui-avatars.com/api/?name=Kurucu&background=f59e0b&color=020617" alt="" referrerpolicy="no-referrer" class="w-7 h-7 rounded-full object-cover border border-amber-500">
                    <span id="header-name" class="text-xs font-bold max-w-[110px] truncate hidden sm:inline">Site Sahibi</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 dark:text-slate-400"></i>
                </button>

                <div id="corner-dropdown" class="hidden absolute right-0 top-12 w-72 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-3 space-y-2 z-50">
                    <div class="flex items-center gap-2.5 p-2 rounded-xl bg-slate-50 dark:bg-slate-950/60">
                        <img id="menu-avatar" onclick="openPhotoPreview(this.src)" src="https://ui-avatars.com/api/?name=Kurucu&background=f59e0b&color=020617" alt="" referrerpolicy="no-referrer" class="w-10 h-10 rounded-full object-cover border border-amber-500 cursor-pointer hover:opacity-85 transition">
                        <div class="min-w-0">
                            <div id="menu-name" class="text-xs font-bold truncate">Site Sahibi</div>
                            <div id="menu-email" class="text-[11px] text-slate-500 truncate"></div>
                        </div>
                    </div>

                    <div class="space-y-1 pt-1">
                        <button onclick="openDrawerTab('profile')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-user-pen text-emerald-500 w-4"></i> <span>Profil Bilgileri</span></span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </button>

                        <button onclick="openDrawerTab('pitches_crud')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-futbol text-sky-500 w-4"></i> <span>Saha Yönetimi</span></span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </button>

                        <button onclick="openDrawerTab('users_crud')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-users-gear text-amber-500 w-4"></i> <span>Kullanıcı & Rol Yönetimi</span></span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </button>
                    </div>

                    <div class="border-t border-slate-200 dark:border-slate-800 pt-2">
                        <button onclick="logout()" class="w-full py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition">Çıkış Yap</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ANA SAYFA İÇERİĞİ -->
    <main id="top" class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- ARAMA & FİLTRELEME -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-4 gap-3">
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Tarih</label>
                <input type="date" id="match-date" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">İlçe</label>
                <select id="filter-district" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-emerald-500">
                    <option value="">Tümü</option>
                    <option value="Selçuklu">Selçuklu</option>
                    <option value="Meram">Meram</option>
                    <option value="Karatay">Karatay</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Saha veya Adres Ara</label>
                <input type="text" id="filter-search" oninput="renderAll()" placeholder="Saha, mahalle, cadde..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Sıralama</label>
                <select id="filter-sort" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-emerald-500">
                    <option value="default">Varsayılan</option>
                    <option value="price_asc">Ücret: Artan</option>
                    <option value="price_desc">Ücret: Azalan</option>
                </select>
            </div>
        </section>

        <!-- SAHALAR LİSTESİ -->
        <div id="pitches-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <!-- TÜM REZERVASYONLAR -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
            <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-3">Tüm Rezervasyonlar</h2>
            <div id="bookings-list" class="space-y-2 text-xs"></div>
        </section>
    </main>

    <!-- YAN ÇEKMECE -->
    <div id="side-drawer-overlay" onclick="closeSideDrawer()" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs"></div>
    <aside id="side-drawer" class="fixed top-0 right-0 z-50 h-full w-full max-w-md bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl transform translate-x-full transition-transform duration-200 flex flex-col">
        <div class="px-5 h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <h3 id="drawer-title" class="text-sm font-extrabold">Profil Bilgileri</h3>
            <button onclick="closeSideDrawer()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="px-5 py-2.5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-1.5 overflow-x-auto text-xs font-bold">
            <button id="tab-btn-profile" onclick="switchDrawerTab('profile')" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950">Profil</button>
            <button id="tab-btn-pitches_crud" onclick="switchDrawerTab('pitches_crud')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">Sahalar</button>
            <button id="tab-btn-users_crud" onclick="switchDrawerTab('users_crud')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">Kullanıcılar</button>
            <button id="tab-btn-notifications" onclick="switchDrawerTab('notifications')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">Bildirimler</button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-5 text-xs">

            <!-- PROFİL -->
            <div id="tab-content-profile" class="space-y-4">
                <div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                    <img id="drawer-avatar-preview" onclick="openPhotoPreview(this.src)" src="" alt="" referrerpolicy="no-referrer" class="w-14 h-14 rounded-full object-cover border-2 border-amber-500 cursor-pointer hover:opacity-85 transition">
                    <div class="space-y-2 flex-1">
                        <div class="font-bold text-sm" id="drawer-profile-name">Site Sahibi</div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <label class="cursor-pointer px-2.5 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 font-bold hover:bg-emerald-500/25 transition">
                                <i class="fa-solid fa-camera mr-1"></i> Fotoğraf Seç
                                <input type="file" accept="image/*" onchange="handlePhotoUpload(event)" class="hidden">
                            </label>
                            <button type="button" onclick="useGooglePhoto()" class="px-2.5 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 font-bold hover:opacity-80 transition">
                                <i class="fa-brands fa-google mr-1"></i> Google Fotoğrafı
                            </button>
                        </div>
                    </div>
                </div>

                <form onsubmit="saveFounderProfile(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1">Ad Soyad</label>
                        <input type="text" id="prof-name" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1">Telefon</label>
                        <input type="tel" id="prof-phone" placeholder="05XX XXX XX XX" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:border-emerald-500">
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold transition">
                        Kaydet
                    </button>
                </form>
            </div>

            <!-- SAHA EKLE / DÜZENLE / SİL / FOTOĞRAF DEĞİŞTİR -->
            <div id="tab-content-pitches_crud" class="hidden space-y-4">
                <form onsubmit="savePitchItem(event)" class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-2.5">
                    <div class="font-bold" id="pitch-form-title">Yeni Saha Ekle</div>
                    <input type="hidden" id="edit-pitch-id">
                    <input type="hidden" id="edit-pitch-photo">
                    <input type="text" id="pitch-name" required placeholder="Saha Adı" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="pitch-district" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                            <option value="Selçuklu">Selçuklu</option>
                            <option value="Meram">Meram</option>
                            <option value="Karatay">Karatay</option>
                        </select>
                        <input type="number" id="pitch-price" required placeholder="Ücret (₺)" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1">Saha Sahibi Üye</label>
                        <select id="pitch-owner-select" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                            <option value="">Atanmamış</option>
                        </select>
                    </div>
                    <input type="text" id="pitch-phone" placeholder="Saha Telefonu (05XX XXX XX XX)" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <input type="text" id="pitch-address" placeholder="Adres" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="pitch-lat" placeholder="Enlem (örn. 38.0185)" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                        <input type="text" id="pitch-lng" placeholder="Boylam (örn. 32.5152)" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    </div>
                    <div class="flex items-center justify-between gap-2 pt-1">
                        <label class="cursor-pointer px-3 py-1.5 rounded-lg bg-sky-500/15 text-sky-600 dark:text-sky-300 font-bold text-[11px]">
                            <i class="fa-solid fa-image mr-1"></i> Fotoğraf Seç / Değiştir
                            <input type="file" accept="image/*" onchange="handleFormPitchPhotoUpload(event)" class="hidden">
                        </label>
                        <span id="form-pitch-photo-status" class="text-[10px] text-slate-400">Fotoğraf seçilmedi</span>
                    </div>
                    <input type="text" id="pitch-hours" value="16:00, 17:00, 18:00, 19:00, 20:00, 21:00, 22:00, 23:00" placeholder="Saatler (virgülle ayırın)" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <div class="flex items-center gap-2">
                        <button type="submit" class="flex-1 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold">Kaydet</button>
                        <button type="button" onclick="resetPitchForm()" class="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold">Temizle</button>
                    </div>
                </form>

                <div id="founder-pitches-list" class="space-y-2"></div>
            </div>

            <!-- KULLANICI ROL / ENGEL / SİLME / ANLIK BİLGİ & ESKİ BİLGİLER -->
            <div id="tab-content-users_crud" class="hidden space-y-3">
                <input type="text" id="user-search" oninput="renderUsersList()" placeholder="Ad, soyad, önceki ad, e-posta, eski e-posta, telefon, eski telefon ara..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:border-emerald-500">
                <div id="founder-users-list" class="space-y-2"></div>
            </div>

            <!-- TÜM BİLDİRİMLER & ONAYLAR -->
            <div id="tab-content-notifications" class="hidden space-y-2.5">
                <div id="founder-notifications-list" class="space-y-2"></div>
            </div>

        </div>
    </aside>

    <!-- BÜYÜK FOTOĞRAF ÖNİZLEME -->
    <div id="photo-preview-modal" onclick="closePhotoPreview()" class="hidden fixed inset-0 z-60 bg-black/70 backdrop-blur-md flex items-center justify-center p-6">
        <img id="photo-preview-img" onclick="event.stopPropagation()" src="" alt="" referrerpolicy="no-referrer" class="max-w-full max-h-[82vh] rounded-3xl shadow-2xl border-2 border-white/20 object-contain">
    </div>

    <!-- KULLANICI ANLIK & ESKİ BİLGİ PENCERESİ -->
    <div id="user-detail-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4 shadow-2xl text-xs">
            <div class="flex items-center justify-between">
                <h3 id="user-detail-title" class="text-sm font-extrabold">Kullanıcı Bilgileri</h3>
                <button onclick="closeUserDetailModal()" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="user-detail-body" class="space-y-2 bg-slate-50 dark:bg-slate-950 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 max-h-[65vh] overflow-y-auto"></div>
            <div class="flex justify-end">
                <button onclick="closeUserDetailModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">Kapat</button>
            </div>
        </div>
    </div>

    <!-- RANDEVU DETAY & İPTAL PENCERESİ -->
    <div id="slot-detail-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4 shadow-2xl">
            <h3 id="slot-detail-title" class="text-sm font-extrabold">Randevu Detayı</h3>
            <div id="slot-detail-body" class="text-xs text-slate-600 dark:text-slate-300 space-y-1.5 bg-slate-50 dark:bg-slate-950 p-3 rounded-xl border border-slate-200 dark:border-slate-800"></div>
            <div id="slot-detail-actions" class="flex items-center justify-end gap-2"></div>
        </div>
    </div>

    <!-- REZERVASYON TÜRÜ SEÇİM PENCERESİ (HAFTALIK / TEK SEFERLİK) -->
    <div id="booking-type-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4 shadow-2xl">
            <h3 class="text-sm font-extrabold">Rezervasyon Seçeneği</h3>
            <div id="booking-type-info" class="text-xs text-slate-500 bg-slate-50 dark:bg-slate-950 p-3 rounded-xl border border-slate-200 dark:border-slate-800"></div>
            <div class="grid grid-cols-2 gap-2.5">
                <button id="btn-single-booking" class="py-2.5 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs transition">
                    Tek seferlik
                </button>
                <button id="btn-weekly-booking" class="py-2.5 px-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-xs transition">
                    Haftalık
                </button>
            </div>
            <button onclick="closeBookingTypeModal()" class="w-full py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs">
                Vazgeç
            </button>
        </div>
    </div>

    <!-- GENEL TEYİT PENCERESİ -->
    <div id="confirm-dialog" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4 shadow-2xl">
            <h3 id="confirm-title" class="text-sm font-extrabold">Onay</h3>
            <div id="confirm-body" class="text-xs text-slate-600 dark:text-slate-300 space-y-1.5 bg-slate-50 dark:bg-slate-950 p-3 rounded-xl border border-slate-200 dark:border-slate-800"></div>
            <div class="flex items-center justify-end gap-2">
                <button onclick="closeConfirmDialog()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs">
                    Vazgeç
                </button>
                <button id="confirm-proceed-btn" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs">
                    Onayla
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            collection,

            setDoc,
            getDoc,

        const DEFAULT_HOURS = ["16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"];
        const LOGIN_PAGE = "index.html";
        const PITCHES_STORAGE_KEY = "top_oyna_founder_pitches_v1";
        const BOOKINGS_STORAGE_KEY = "top_oyna_founder_bookings_v1";

        const firebaseConfig = {
            apiKey: "AIzaSyCKYARoGK8ADJ2_T5c2GomrAG47-gHtQ-8",
            authDomain: "top-oyna-d33f3.firebaseapp.com",
            projectId: "top-oyna-d33f3",
            storageBucket: "top-oyna-d33f3.firebasestorage.app",
            messagingSenderId: "1033043310464",
            appId: "1:1033043310464:web:d467e84b68f73e99f0f365",
            measurementId: "G-P2ZRQQFFMD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        }

        function addDays(dateStr, days) {
            const parts = String(dateStr).split("-").map(Number);
            const dt = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
            dt.setDate(dt.getDate() + days);
            return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
        }

        function formatTimeTR(ts) {

        }

        function compressImageFile(file, maxSize, quality, callback) {
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL("image/jpeg", quality));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

            const existing = pitches.find(x => x.id === id);
            const hours = document.getElementById("pitch-hours").value.split(",").map(s => s.trim()).filter(Boolean);

            const selectedOwnerId = document.getElementById("pitch-owner-select").value;
            const ownerUser = users.find(u => (u.uid || u.id) === selectedOwnerId);

            const ownerId = ownerUser ? (ownerUser.uid || ownerUser.id) : (selectedOwnerId || "");
            const ownerName = ownerUser ? (ownerUser.name || "Üye") : (existing?.ownerName || "");
            const ownerEmail = ownerUser ? (ownerUser.email || "") : (existing?.ownerEmail || "");

            const latVal = parseFloat(document.getElementById("pitch-lat").value.trim());
            const lngVal = parseFloat(document.getElementById("pitch-lng").value.trim());

        function getUserSearchBlob(u) {
            const prevNames = Array.isArray(u.nameHistory) ? u.nameHistory.map(h => h.value || h).join(" ") : (u.previousName || "");
            const prevEmails = Array.isArray(u.emailHistory) ? u.emailHistory.map(h => h.value || h).join(" ") : (u.previousEmail || "");
            const prevPhones = Array.isArray(u.phoneHistory) ? u.phoneHistory.map(h => h.value || h).join(" ") : (u.previousPhone || "");
            return [
                u.name || "",
                u.firstName || "",
                u.lastName || "",
                u.email || "",
                u.phone || "",
                prevNames,
                prevEmails,
                prevPhones
            ].join(" ").toLowerCase();
        }

        function formatHistoryList(list, fallbackSingle) {
            if (Array.isArray(list) && list.length > 0) {
                return list.map(item => {
                    if (typeof item === "string") return `<div>• ${item}</div>`;
                    return `<div>• <b>${item.value || "-"}</b> <span class="text-[10px] text-slate-400">(${formatTimeTR(item.changedAt)})</span></div>`;
                }).join("");
            }
            if (fallbackSingle) {
                return `<div>• <b>${fallbackSingle}</b></div>`;
            }
            return `<div class="text-slate-400">Kayıtlı eski bilgi yok</div>`;
        }

        function buildUserDetailHtml(u) {
            const nameHist = formatHistoryList(u.nameHistory, u.previousName);
            const emailHist = formatHistoryList(u.emailHistory, u.previousEmail);
            const phoneHist = formatHistoryList(u.phoneHistory, u.previousPhone);

            return `
                <div class="space-y-2 pb-2 border-b border-slate-200 dark:border-slate-800">
                    <div class="font-extrabold text-emerald-600 dark:text-emerald-400 uppercase text-[10px]">Güncel Bilgiler</div>

                    <div><b>Telefon:</b> ${u.phone || "-"}</div>
                    <div><b>Rol:</b> ${u.role || "user"}</div>
                    <div><b>Durum:</b> ${u.blocked ? "Engelli" : "Aktif"}</div>
                </div>
                <div class="space-y-1.5 pt-1">
                    <div class="font-extrabold text-amber-600 dark:text-amber-400 uppercase text-[10px]">Önceki Bilgiler</div>
                    <div><b>Önceki İsimler:</b>${nameHist}</div>

        window.changeUserRole = async (uid, role) => {
            users = users.map(u => (u.uid === uid || u.id === uid) ? { ...u, role } : u);
            try { await setDoc(doc(db, "users", uid), { role }, { merge: true }); } catch (_) {}
            renderUsersList();
            populatePitchOwnerSelect(document.getElementById("pitch-owner-select")?.value || "", "");
        };

        // ENGELLEYİNCE ANLIK ÇIKIŞ & TEKRAR GİREMEME
        window.toggleBlockUser = async (uid, blocked) => {
            users = users.map(u => (u.uid === uid || u.id === uid) ? { ...u, blocked, forceLogoutAt: blocked ? Date.now() : null } : u);
            try {
                await setDoc(doc(db, "users", uid), {
                    blocked,
                    forceLogoutAt: blocked ? Date.now() : null
                }, { merge: true });
            } catch (_) {}
            renderUsersList();
            if (activeUserDetailUid === uid) {
                const updated = users.find(u => (u.uid || u.id) === uid);
                if (updated) document.getElementById("user-detail-body").innerHTML = buildUserDetailHtml(updated);
            }
        };

        // KULLANICI SİLİNCE ANLIK ÇIKIŞ & SİLİNME İŞARETİ
        window.deleteUserAccount = async (uid, name) => {
            openConfirmDialog({
                title: "Kullanıcıyı Sil",
                html: `<div><b>${name}</b> silinecek ve oturumu anında kapatılacak. Onaylıyor musunuz?</div>`,
                onConfirm: async () => {
                    const target = users.find(u => (u.uid || u.id) === uid);
                    users = users.filter(u => u.uid !== uid && u.id !== uid);
                    if (activeUserDetailUid === uid) closeUserDetailModal();
                    renderUsersList();
                    populatePitchOwnerSelect(document.getElementById("pitch-owner-select")?.value || "", "");

                    try {
                        await setDoc(doc(db, "users", uid), {
                            deleted: true,
                            deletedAt: Date.now(),
                            forceLogoutAt: Date.now()
                        }, { merge: true });
                        await setDoc(doc(db, "deleted_sessions", uid), {
                            uid,
                            deletedAt: Date.now(),
                            user: target || {}
                        }, { merge: true });
                        await deleteDoc(doc(db, "users", uid));
                    } catch (_) {}
                }
            });
        };

        window.renderUsersList = () => {
            const el = document.getElementById("founder-users-list");
            if (!el) return;
            const q = (document.getElementById("user-search")?.value || "").trim().toLowerCase();
            const list = users.filter(u => !q || getUserSearchBlob(u).includes(q));
            el.innerHTML = list.map(u => {
                const uid = u.uid || u.id;
                const role = u.role || "user";
                const isBlocked = Boolean(u.blocked);
                const safeName = (u.name || "Kullanıcı").replace(/'/g, "");
                return `
                    <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-2">
                        <div class="flex items-center justify-between gap-2">
                            <div class="min-w-0">
                                <div class="font-bold truncate">${u.name || "Kullanıcı"}</div>
                                <div class="text-[11px] text-slate-500 truncate">${u.email || ""} ${u.phone ? "• " + u.phone : ""}</div>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-800">${role}</span>
                        </div>
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <button onclick="openUserDetailModal('${uid}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-500/15 text-sky-600 dark:text-sky-300">
                                Bilgileri Gör
                            </button>
                            <select onchange="changeUserRole('${uid}', this.value)" class="px-2 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-[11px] font-bold">
                                <option value="user" ${role === "user" ? "selected" : ""}>Üye</option>
                                <option value="manager" ${role === "manager" ? "selected" : ""}>Saha Sahibi</option>
                                <option value="founder" ${role === "founder" ? "selected" : ""}>Site Sahibi</option>
                            </select>
                            <button onclick="toggleBlockUser('${uid}', ${!isBlocked})" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${isBlocked ? "bg-emerald-500/20 text-emerald-500" : "bg-amber-500/20 text-amber-500"}">
                                ${isBlocked ? "Engeli Kaldır" : "Engelle"}
                            </button>
                            <button onclick="deleteUserAccount('${uid}', '${safeName}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-rose-500/20 text-rose-500">
                                Sil
                            </button>
                        </div>
                    </div>
                `;
            }).join("");
        };

        function openConfirmDialog({ title, html, onConfirm }) {
            document.getElementById("confirm-title").textContent = title;
            document.getElementById("confirm-body").innerHTML = html;
            pendingConfirmAction = onConfirm;
            document.getElementById("confirm-proceed-btn").onclick = async () => {
                const fn = pendingConfirmAction;
                closeConfirmDialog();
                if (fn) await fn();
            };
            document.getElementById("confirm-dialog").classList.remove("hidden");
        }

        window.closeConfirmDialog = () => {
            document.getElementById("confirm-dialog").classList.add("hidden");
            pendingConfirmAction = null;
        };

        window.closeSlotDetailModal = () => {
            document.getElementById("slot-detail-modal").classList.add("hidden");
        };

        window.openBookingDetailModal = (bookingId) => {
            const bk = bookings.find(b => b.id === bookingId);
            if (!bk) return;
            const modeLabel = bk.bookingType === "weekly" ? "Haftalık" : "Tek seferlik";
            document.getElementById("slot-detail-title").textContent = `${bk.pitchName} • ${bk.hour}`;
            document.getElementById("slot-detail-body").innerHTML = `
                <div><b>Tarih:</b> ${bk.date}</div>
                <div><b>Tür:</b> ${modeLabel}</div>
                <div><b>Üye:</b> ${bk.userName || "Üye"}</div>
                <div><b>Telefon:</b> ${bk.userPhone || "-"}</div>
                <div><b>E-posta:</b> ${bk.userEmail || "-"}</div>
            `;
            document.getElementById("slot-detail-actions").innerHTML = `
                <button onclick="closeSlotDetailModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs">Kapat</button>
                <button onclick="cancelBookingByFounder('${bk.id}')" class="px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs">İptal et</button>
            `;
            document.getElementById("slot-detail-modal").classList.remove("hidden");
        };

        window.cancelBookingByFounder = async (bookingId) => {
            closeSlotDetailModal();
            bookings = bookings.filter(b => b.id !== bookingId);
            writeLocalList(BOOKINGS_STORAGE_KEY, bookings);
            renderAll();
            try { await deleteDoc(doc(db, "bookings", bookingId)); } catch (_) {}
        };

        async function createBookingRecord({ pitchId, pitchName, district, address, price, date, hour, bookingType }) {
            const targetDates = bookingType === "weekly" ? [0, 7, 14, 21].map(d => addDays(date, d)) : [date];
            const createdRecords = [];

            for (const dStr of targetDates) {
                const slotDocId = `${pitchId}_${dStr}_${hour.replace(":", "")}`;
                if (bookings.some(b => b.id === slotDocId)) continue;
                createdRecords.push({
                    id: slotDocId,
                    pitchId,
                    pitchName,
                    district,
                    address: address || "",
                    price,
                    date: dStr,
                    hour,
                    bookingType,
                    userId: currentUser.uid,
                    userName: currentUser.name,
                    userEmail: currentUser.email,
                    userPhone: currentUser.phone || "",
                    createdAt: Date.now()
                });
            }

            if (createdRecords.length === 0) return;
            bookings = [...createdRecords, ...bookings];
            writeLocalList(BOOKINGS_STORAGE_KEY, bookings);
            renderAll();

            for (const rec of createdRecords) {
                try {
                    const slotRef = doc(db, "bookings", rec.id);
                    await runTransaction(db, async (tx) => {
                        const snap = await tx.get(slotRef);
                        if (!snap.exists()) tx.set(slotRef, rec);
                    });
                } catch (_) {}
            }
        }

        window.rentSlot = (pitchId, pitchName, district, address, price, date, hour) => {
            const slotDocId = `${pitchId}_${date}_${hour.replace(":", "")}`;
            if (bookings.some(b => b.id === slotDocId)) return;

            openConfirmDialog({
                title: "Rezervasyon Teyidi",
                html: `<div><b>${pitchName}</b> • ${date} • ${hour}</div><div>Seçimi onaylıyor musunuz?</div>`,
                onConfirm: () => {
                    document.getElementById("booking-type-info").innerHTML = `<div><b>${pitchName}</b></div><div>${date} • ${hour}</div>`;
                    document.getElementById("btn-single-booking").onclick = () => {
                        closeBookingTypeModal();
                        createBookingRecord({ pitchId, pitchName, district, address, price, date, hour, bookingType: "single" });
                    };
                    document.getElementById("btn-weekly-booking").onclick = () => {
                        closeBookingTypeModal();
                        createBookingRecord({ pitchId, pitchName, district, address, price, date, hour, bookingType: "weekly" });
                    };
                    document.getElementById("booking-type-modal").classList.remove("hidden");
                }
            });
        };

        // SABİT BOYUTLU BUTONLAR (BOŞ: BEYAZ, DOLU: GRİ, KENDİ REZERVASYONU: YEŞİL + İPTAL ET)
        window.renderAll = () => {
            const date = document.getElementById("match-date").value || getToday();
            const district = document.getElementById("filter-district").value;
            const search = document.getElementById("filter-search").value.trim().toLowerCase();
            const sortMode = document.getElementById("filter-sort").value;

            let filtered = pitches.filter(p => {
                const okDist = !district || p.district === district;
                const okSearch = !search ||
                    (p.name || "").toLowerCase().includes(search) ||
                    (p.address || "").toLowerCase().includes(search) ||
                    (p.district || "").toLowerCase().includes(search);
                return okDist && okSearch;
            });

            if (sortMode === "price_asc") filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
            if (sortMode === "price_desc") filtered.sort((a, b) => (b.price || 0) - (a.price || 0));

            const listEl = document.getElementById("pitches-list");
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="col-span-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-500">Saha bulunamadı.</div>`;
            } else {
                listEl.innerHTML = filtered.map(p => {
                    const pHours = p.hours && p.hours.length ? p.hours : DEFAULT_HOURS;
                    const buttons = pHours.map(h => {
                        const slotId = `${p.id}_${date}_${h.replace(":", "")}`;
                        const taken = bookings.find(b => b.id === slotId);

                        if (taken) {
                            if (taken.userId === currentUser.uid) {
                                return `<button onclick="cancelBookingByFounder('${taken.id}')" class="h-12 w-full rounded-xl bg-emerald-500 hover:bg-emerald-400 border border-emerald-600 text-slate-950 text-xs font-extrabold flex flex-col items-center justify-center leading-tight transition"><span>${h}</span><span class="text-[10px]">İptal et</span></button>`;
                            }
                            return `<button onclick="openBookingDetailModal('${taken.id}')" class="h-12 w-full rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold flex flex-col items-center justify-center leading-tight transition"><span>${h}</span><span class="text-[10px] font-normal">Dolu</span></button>`;
                        }

                        return `<button onclick="rentSlot('${p.id}', '${p.name.replace(/'/g, "")}', '${p.district}', '${(p.address || "").replace(/'/g, "")}', ${p.price || 0}, '${date}', '${h}')" class="h-12 w-full rounded-xl bg-white hover:bg-slate-100 text-slate-900 border border-slate-300 text-xs font-bold flex flex-col items-center justify-center leading-tight transition"><span>${h}</span></button>`;
                    }).join("");

                    const photoUrl = p.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&size=600&background=0f172a&color=34d399`;

                    return `
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden space-y-3 pb-4">
                            <img src="${photoUrl}" onclick="openPhotoPreview(this.src)" alt="${p.name}" class="w-full h-52 object-cover cursor-pointer hover:opacity-95 transition">
                            <div class="px-4 flex items-start justify-between gap-3">
                                <div>
                                    <h3 class="font-extrabold text-sm">${p.name}</h3>
                                    <p class="text-xs text-slate-500 mt-0.5">${p.district} • <span class="font-bold text-emerald-600 dark:text-emerald-400">${Number(p.price || 0).toLocaleString("tr-TR")} ₺</span></p>
                                    ${p.address ? `<p class="text-[11px] text-slate-400 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>${p.address}</p>` : ""}
                                </div>
                                <button onclick="openDrawerTab('pitches_crud'); editPitchItem('${p.id}')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-[11px] font-bold shrink-0">
                                    Düzenle
                                </button>
                            </div>
                            <div class="px-4 grid grid-cols-4 gap-2">${buttons}</div>
                        </div>
                    `;
                }).join("");
            }

            const bookingsEl = document.getElementById("bookings-list");
            const sortedBookings = [...bookings].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            if (sortedBookings.length === 0) {
                bookingsEl.innerHTML = `<div class="text-slate-500">Rezervasyon yok.</div>`;
            } else {
                bookingsEl.innerHTML = sortedBookings.map(b => `
                    <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2.5 rounded-xl gap-2">
                        <div>
                            <span class="font-bold">${b.pitchName}</span>
                            <span class="text-slate-500"> • ${b.date} • </span>
                            <span class="text-rose-500 font-bold">${b.hour}</span>
                            <span class="text-slate-400"> (${b.userName || "Üye"})</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openBookingDetailModal('${b.id}')" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 font-bold">Bilgi</button>
                            <button onclick="cancelBookingByFounder('${b.id}')" class="px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold transition">İptal et</button>
                        </div>
                    </div>
                `).join("");
            }
        };

        async function loadFounderUser(user) {
            const googleInfo = Array.isArray(user.providerData)
                ? user.providerData.find(p => p && p.providerId === "google.com")
                : null;
            const gPhoto = (googleInfo && googleInfo.photoURL) || user.photoURL || "";
            const name = (googleInfo && googleInfo.displayName) || user.displayName || "Site Sahibi";
            const email = (googleInfo && googleInfo.email) || user.email || "eyupensarus@gmail.com";

            let existing = {};
            try {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) existing = snap.data();
            } catch (_) {}

            currentUser = {
                uid: user.uid,
                name: existing.name || name,
                email,
                phone: existing.phone || "",
                photo: existing.photo || gPhoto || "",
                googlePhoto: gPhoto
            };

            try {
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: currentUser.name,
                    email: currentUser.email,
                    phone: currentUser.phone,
                    photo: currentUser.photo,
                    googlePhoto: currentUser.googlePhoto,
                    role: "founder",
                    lastLoginAt: Date.now()
                }, { merge: true });
            } catch (_) {}

            syncProfileUI();
            renderAll();
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await loadFounderUser(user);
            } else {
                syncProfileUI();
                renderAll();
            }

            onSnapshot(collection(db, "pitches"), (snap) => {
                if (!snap.empty) {
                    pitches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    writeLocalList(PITCHES_STORAGE_KEY, pitches);
                    renderAll();
                    renderFounderPitchesList();
                }
            }, () => {});

            onSnapshot(collection(db, "bookings"), (snap) => {
                if (!snap.empty) {
                    bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    writeLocalList(BOOKINGS_STORAGE_KEY, bookings);
                    renderAll();
                }
            }, () => {});

            onSnapshot(collection(db, "users"), (snap) => {
                users = snap.docs.map(d => ({ id: d.id, uid: d.id, ...d.data() }));
                renderUsersList();
                populatePitchOwnerSelect(document.getElementById("pitch-owner-select")?.value || "", "");
                renderFounderPitchesList();
                if (activeUserDetailUid) {
                    const activeU = users.find(u => (u.uid || u.id) === activeUserDetailUid);
                    if (activeU) {
                        document.getElementById("user-detail-body").innerHTML = buildUserDetailHtml(activeU);
                    }
                }
            }, () => {});

            onSnapshot(collection(db, "notifications"), (snap) => {
                notifications = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateNotifBadge();
                renderNotifications();
            }, () => {});
        });

        window.logout = async () => {
            try { await signOut(auth); } catch (_) {}
            window.location.replace(LOGIN_PAGE);
        };
    </script>
</body>
</html>
