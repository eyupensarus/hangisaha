<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangi Saha - Saha Sahibi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
        body { transition: background-color 0.2s, color 0.2s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">

    <!-- YETKİ KİLİT EKRANI -->
    <div id="manager-guard-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-3 shadow-2xl">
            <div class="w-11 h-11 mx-auto rounded-2xl bg-sky-500/15 text-sky-500 flex items-center justify-center text-lg">
                <i class="fa-solid fa-store"></i>
            </div>
            <h2 id="manager-guard-title" class="text-sm font-extrabold text-white">İşletme Yetkisi Doğrulanıyor</h2>
            <p id="manager-guard-message" class="text-xs text-slate-400 leading-relaxed">Saha sahibi yetkileriniz kontrol ediliyor.</p>
        </div>
    </div>

    <!-- ÜST BAR -->
    <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <a href="#top" onclick="resetHomeView(event)" class="flex items-center gap-2.5 group">
                <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-black text-base shadow-sm">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <span class="text-lg font-extrabold tracking-tight text-emerald-600 dark:text-emerald-400">HANGİ SAHA</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-600 dark:text-sky-300 border border-sky-500/30">
                    <i class="fa-solid fa-store mr-1"></i>Saha Sahibi
                </span>
            </a>

            <div class="flex items-center gap-2 relative">
                <button onclick="openDrawerTab('notifications')" class="relative px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center gap-1.5 transition">
                    <i id="mgr-bell" class="fa-solid fa-bell text-amber-500"></i>
                    <span class="hidden sm:inline">Bildirimler</span>
                    <span id="manager-notif-badge" class="hidden min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-extrabold flex items-center justify-center">0</span>
                </button>

                <button id="corner-menu-btn" onclick="toggleCornerMenu(event)" class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition">
                    <img id="header-avatar" src="https://ui-avatars.com/api/?name=Isletme&background=0ea5e9&color=020617" alt="" referrerpolicy="no-referrer" class="w-7 h-7 rounded-full object-cover border border-sky-500">
                    <span id="header-name" class="text-xs font-bold max-w-[110px] truncate hidden sm:inline">Saha Sahibi</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                </button>

                <div id="corner-dropdown" onclick="event.stopPropagation()" class="hidden absolute right-0 top-12 w-72 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-3 space-y-2 z-50">
                    <div class="flex items-center gap-2.5 p-2 rounded-xl bg-slate-50 dark:bg-slate-950/60">
                        <img id="menu-avatar" onclick="openPhotoPreview(this.src)" src="https://ui-avatars.com/api/?name=Isletme&background=0ea5e9&color=020617" alt="" referrerpolicy="no-referrer" class="w-10 h-10 rounded-full object-cover border border-sky-500 cursor-pointer">
                        <div class="min-w-0">
                            <div id="menu-name" class="text-xs font-bold truncate">Saha Sahibi</div>
                            <div id="menu-email" class="text-[11px] text-slate-500 truncate"></div>
                        </div>
                    </div>
                    <div class="space-y-1 pt-1">
                        <button onclick="openDrawerTab('profile')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-user-pen text-emerald-500 w-4"></i> <span>Profil Bilgileri</span></span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </button>
                        <button onclick="openDrawerTab('my_pitches')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-futbol text-sky-500 w-4"></i> <span>Sahalarım</span></span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </button>
                        <button onclick="openDrawerTab('bookings_manage')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-calendar-check text-rose-500 w-4"></i> <span>Rezervasyonlar</span></span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </button>
                        <button onclick="openDrawerTab('verify_members')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-user-check text-amber-500 w-4"></i> <span>Üye & Telefon Doğrulama</span></span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </button>
                    </div>
                    <div class="border-t border-slate-200 dark:border-slate-800 pt-2">
                        <button onclick="logout()" class="w-full py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Çıkış Yap</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="top" class="max-w-6xl mx-auto px-4 py-6 space-y-6">
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1"><i class="fa-regular fa-calendar mr-1 text-emerald-500"></i>Tarih</label>
                <input type="date" id="match-date" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1"><i class="fa-solid fa-magnifying-glass mr-1 text-sky-500"></i>Saha Ara</label>
                <input type="text" id="filter-search" oninput="renderAll()" placeholder="Saha veya adres ara..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1"><i class="fa-solid fa-arrow-up-wide-short mr-1 text-amber-500"></i>Sıralama</label>
                <select id="filter-sort" onchange="renderAll()" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-emerald-500">
                    <option value="default">Varsayılan</option>
                    <option value="price_asc">Ücret: Artan</option>
                    <option value="price_desc">Ücret: Azalan</option>
                </select>
            </div>
        </section>

        <div id="pitches-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <!-- YAN ÇEKMECE -->
    <div id="side-drawer-overlay" onclick="closeSideDrawer()" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs"></div>
    <aside id="side-drawer" onclick="event.stopPropagation()" class="fixed top-0 right-0 z-50 h-full w-full max-w-lg bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl transform translate-x-full transition-transform duration-200 flex flex-col">
        <div class="px-5 h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <h3 id="drawer-title" class="text-sm font-extrabold">Profil Bilgileri</h3>
            <button onclick="closeSideDrawer()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="px-5 py-2.5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-1.5 overflow-x-auto text-xs font-bold">
            <button id="tab-btn-profile" onclick="switchDrawerTab('profile')" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950 shrink-0"><i class="fa-solid fa-user mr-1"></i>Profil</button>
            <button id="tab-btn-my_pitches" onclick="switchDrawerTab('my_pitches')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 shrink-0"><i class="fa-solid fa-futbol mr-1"></i>Sahalarım</button>
            <button id="tab-btn-bookings_manage" onclick="switchDrawerTab('bookings_manage')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 shrink-0"><i class="fa-solid fa-calendar-check mr-1"></i>Rezervasyonlar</button>
            <button id="tab-btn-verify_members" onclick="switchDrawerTab('verify_members')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 shrink-0"><i class="fa-solid fa-user-check mr-1"></i>Üyeler</button>
            <button id="tab-btn-notifications" onclick="switchDrawerTab('notifications')" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 shrink-0"><i class="fa-solid fa-bell mr-1"></i>Bildirimler</button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-5 text-xs">
            <!-- PROFİL -->
            <div id="tab-content-profile" class="space-y-4">
                <form onsubmit="saveManagerProfile(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1">Ad Soyad / İşletme Adı</label>
                        <input type="text" id="prof-name" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1">Telefon</label>
                        <input type="tel" id="prof-phone" placeholder="05XX XXX XX XX" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none focus:border-emerald-500">
                    </div>
                    <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold transition"><i class="fa-solid fa-check mr-1"></i>Kaydet</button>
                </form>
            </div>

            <!-- SAHALARIM -->
            <div id="tab-content-my_pitches" class="hidden space-y-4">
                <form onsubmit="saveOwnedPitch(event)" class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-2.5">
                    <div class="font-bold" id="owned-pitch-form-title">Yeni Saha Ekle</div>
                    <input type="hidden" id="edit-pitch-id">
                    <input type="text" id="pitch-name" required placeholder="Saha Adı" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="pitch-district" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                            <option value="Selçuklu">Selçuklu</option>
                            <option value="Meram">Meram</option>
                            <option value="Karatay">Karatay</option>
                        </select>
                        <input type="number" id="pitch-price" required placeholder="Ücret (₺)" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    </div>
                    <input type="text" id="pitch-address" placeholder="Adres" class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                    <div class="space-y-1.5 pt-1">
                        <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-500/15 text-sky-600 dark:text-sky-300 font-bold text-[11px]">
                            <i class="fa-solid fa-images"></i> Fotoğraf Ekle (Çoklu Seçilebilir)
                            <input type="file" accept="image/*" multiple onchange="handleMultiPitchPhotoUpload(event)" class="hidden">
                        </label>
                        <div id="form-pitch-photos-preview" class="flex items-center gap-2 flex-wrap"></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="submit" class="flex-1 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold">Kaydet</button>
                        <button type="button" onclick="resetOwnedPitchForm()" class="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold">Temizle</button>
                    </div>
                </form>
                <div id="owned-pitches-list" class="space-y-2"></div>
            </div>

            <!-- REZERVASYONLAR -->
            <div id="tab-content-bookings_manage" class="hidden space-y-3">
                <div class="flex items-center justify-between">
                    <span class="font-extrabold uppercase tracking-wider text-[11px] text-slate-500">Rezervasyonlar</span>
                    <span id="manager-bookings-count" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-300">0</span>
                </div>
                <div id="bookings-list" class="space-y-2"></div>
            </div>

            <!-- ÜYE DOĞRULAMA & TAKMA İSİM -->
            <div id="tab-content-verify_members" class="hidden space-y-3">
                <div class="font-extrabold uppercase tracking-wider text-[11px] text-slate-500">Üye Doğrulama ve Takma İsim</div>
                <div id="manager-verify-users-list" class="space-y-2"></div>
            </div>

            <!-- BİLDİRİMLER -->
            <div id="tab-content-notifications" class="hidden space-y-2.5">
                <div class="flex items-center justify-between">
                    <span class="font-extrabold uppercase tracking-wider text-[11px] text-slate-500">Bildirimler</span>
                    <button type="button" onclick="clearManagerNotifications()" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-rose-500/15 hover:text-rose-500 text-[11px] font-bold transition">
                        <i class="fa-solid fa-broom mr-1"></i> Temizle
                    </button>
                </div>
                <div id="manager-notifications-list" class="space-y-2"></div>
            </div>
        </div>
    </aside>

    <!-- İŞLETME ADINA REZERVASYON OLUŞTURMA MODALI -->
    <div id="manager-create-booking-modal" onclick="closeManagerCreateBookingModal()" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-3 shadow-2xl text-xs">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold"><i class="fa-solid fa-user-plus mr-1.5 text-emerald-500"></i>Müşteri Adına Rezervasyon</h3>
                <button onclick="closeManagerCreateBookingModal()" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="mgr-slot-summary" class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 font-bold"></div>

            <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Kayıtlı Üyelerden Seç</label>
                <select id="mgr-select-existing-user" onchange="fillManagerBookingFromExistingUser(this.value)" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800"></select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Ad Soyad</label>
                    <input type="text" id="mgr-bk-name" placeholder="Müşteri adı" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Takma İsim</label>
                    <input type="text" id="mgr-bk-nickname" placeholder="Takma isim" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Telefon</label>
                    <input type="tel" id="mgr-bk-phone" placeholder="05XX XXX XX XX" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">E-posta / Google</label>
                    <input type="text" id="mgr-bk-email" placeholder="ornek@gmail.com" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1">
                <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-500/15 text-sky-600 dark:text-sky-300 font-bold text-[11px]">
                    <i class="fa-solid fa-camera"></i> Müşteri Fotoğrafı Seç
                    <input type="file" accept="image/*" onchange="handleManagerCustomerPhoto(event)" class="hidden">
                </label>
                <img id="mgr-bk-photo-preview" src="https://ui-avatars.com/api/?name=Musteri&background=10b981&color=020617" class="w-9 h-9 rounded-full object-cover border border-emerald-500">
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button type="button" onclick="confirmManagerBooking('single')" class="py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold">Tek Seferlik Al</button>
                <button type="button" onclick="confirmManagerBooking('weekly')" class="py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold">Abone Al</button>
            </div>
        </div>
    </div>

    <!-- İPTAL ONAY PENCERESİ -->
    <div id="mgr-cancel-modal" onclick="closeMgrCancelModal()" class="hidden fixed inset-0 z-60 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-3 shadow-2xl text-xs">
            <h3 class="text-sm font-extrabold text-rose-500"><i class="fa-solid fa-calendar-xmark mr-1.5"></i>Rezervasyon İptal Onayı</h3>
            <div id="mgr-cancel-info" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 font-semibold"></div>
            <div id="mgr-cancel-actions" class="space-y-2"></div>
            <button onclick="closeMgrCancelModal()" class="w-full py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">Vazgeç</button>
        </div>
    </div>

    <!-- KIRMIZI BİLDİRİM POPUP -->
    <div id="mgr-alert-popup" onclick="closeMgrAlertPopup()" class="hidden fixed inset-0 z-60 bg-black/65 backdrop-blur-xs flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="w-full max-w-sm bg-white dark:bg-slate-900 border-2 border-rose-500/70 rounded-2xl p-5 space-y-3 shadow-2xl text-xs">
            <div class="flex items-center justify-between text-rose-600 dark:text-rose-400 font-extrabold text-sm">
                <span><i class="fa-solid fa-circle-exclamation mr-1"></i> <span id="mgr-alert-title">Uyarı</span></span>
                <button onclick="closeMgrAlertPopup()" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="mgr-alert-body" class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-800 dark:text-rose-200 font-semibold"></div>
            <div class="flex justify-end"><button onclick="closeMgrAlertPopup()" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold">Tamam</button></div>
        </div>
    </div>

    <!-- BÜYÜK FOTOĞRAF ÖNİZLEME -->
    <div id="photo-preview-modal" onclick="closePhotoPreview()" class="hidden fixed inset-0 z-60 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <img id="photo-preview-img" onclick="event.stopPropagation()" src="" alt="" referrerpolicy="no-referrer" class="max-w-[95vw] max-h-[90vh] rounded-2xl object-contain">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            deleteDoc,
            addDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const DEFAULT_HOURS = ["16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"];
        const LOGIN_PAGE = "index.html";
        const FOUNDER_EMAIL = "eyupensarus@gmail.com";

            const dt = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
            dt.setDate(dt.getDate() + days);
            return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;

        function compressFile(file, cb) {
            const r = new FileReader();
            r.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement("canvas");
                    const s = Math.min(1200 / img.width, 1200 / img.height, 1);
                    c.width = Math.round(img.width * s);
                    c.height = Math.round(img.height * s);
                    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
                    cb(c.toDataURL("image/jpeg", 0.85));
                };
                img.src = r.result;
            };
            r.readAsDataURL(file);
        }

            const myEmail = (currentUser.email || "").toLowerCase();
            return notifications
                .filter(n => n.forOwner === true || (n.ownerId && n.ownerId === currentUser.uid) || (myEmail && (n.ownerEmail || "").toLowerCase() === myEmail) || (n.pitchId && ownedIds.has(n.pitchId)))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }

        function updateNotifBadge() {
            const list = getFilteredManagerNotifs();
            const badge = document.getElementById("manager-notif-badge");
            badge.textContent = String(list.length);
            badge.classList.toggle("hidden", list.length === 0);
            const hasRed = list.some(n => n.red === true || n.severity === "critical");
            document.getElementById("mgr-bell").className = hasRed ? "fa-solid fa-bell text-rose-500" : "fa-solid fa-bell text-amber-500";
            list.forEach(n => {
                if ((n.red === true || n.severity === "critical") && !seenMgrPopups.has(n.id) && (Date.now() - Number(n.createdAt || 0)) < 120000) {
                    seenMgrPopups.add(n.id);
                    document.getElementById("mgr-alert-title").textContent = n.title || "Uyarı";
                    document.getElementById("mgr-alert-body").textContent = n.detail || "";
                    document.getElementById("mgr-alert-popup").classList.remove("hidden");
                }
            });
        }

        window.deleteSingleMgrNotif = async (id) => {
            notifications = notifications.filter(n => n.id !== id);
            updateNotifBadge();
            renderManagerNotifications();
            try { await deleteDoc(doc(db, "notifications", id)); } catch (_) {}
        };

        window.clearManagerNotifications = async () => {
            const list = getFilteredManagerNotifs();
            const ids = new Set(list.map(x => x.id));
            notifications = notifications.filter(x => !ids.has(x.id));
            updateNotifBadge();
            renderManagerNotifications();
            for (const item of list) {
                try { await deleteDoc(doc(db, "notifications", item.id)); } catch (_) {}
            }
        };

        function renderManagerNotifications() {
            const el = document.getElementById("manager-notifications-list");
            const list = getFilteredManagerNotifs();
            if (!list.length) {
                el.innerHTML = `<div class="text-slate-500 text-center py-6">Bildirim yok.</div>`;
                return;
            }
            el.innerHTML = list.map(n => {
                const red = n.red === true || n.severity === "critical";
                return `
                    <div class="p-3 rounded-xl border ${red ? "bg-rose-500/10 border-rose-500/45 text-rose-800 dark:text-rose-200" : "bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800"} flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center justify-between gap-2">
                                <span class="font-bold">${n.title || "Bildirim"}</span>
                                <span class="text-[10px] text-slate-400">${formatTimeTR(n.createdAt)}</span>
                            </div>
                            <div class="text-[11px] mt-0.5">${n.detail || ""}</div>
                        </div>
                        <button onclick="deleteSingleMgrNotif('${n.id}')" class="w-6 h-6 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-500 flex items-center justify-center shrink-0"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>
                `;
            }).join("");
        }

        window.saveManagerProfile = async (e) => {
            e.preventDefault();
            currentUser.name = document.getElementById("prof-name").value.trim() || currentUser.name;
            currentUser.phone = document.getElementById("prof-phone").value.trim();
            document.getElementById("header-name").textContent = currentUser.name;
            document.getElementById("menu-name").textContent = currentUser.name;
            try { await setDoc(doc(db, "users", currentUser.uid), { name: currentUser.name, phone: currentUser.phone }, { merge: true }); } catch (_) {}
            closeSideDrawer();
        };

        window.renderAll = () => {
            if (!currentUser.isManager) return;
            const date = document.getElementById("match-date").value || getToday();
            const search = document.getElementById("filter-search").value.trim().toLowerCase();
            const sortMode = document.getElementById("filter-sort").value;
            let list = ownedPitches.filter(p => !search || (p.name || "").toLowerCase().includes(search) || (p.address || "").toLowerCase().includes(search));
            if (sortMode === "price_asc") list.sort((a, b) => (a.price || 0) - (b.price || 0));
            if (sortMode === "price_desc") list.sort((a, b) => (b.price || 0) - (a.price || 0));

            const el = document.getElementById("pitches-list");
            if (!list.length) {
                el.innerHTML = `<div class="col-span-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-500">Size atanmış saha bulunamadı.</div>`;
                return;
            }
            el.innerHTML = list.map(p => {
                const hours = p.hours && p.hours.length ? p.hours : DEFAULT_HOURS;
                const photo = (Array.isArray(p.photos) && p.photos[0]) || p.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&size=800&background=0f172a&color=34d399`;
                const btns = hours.map(h => {
                    const slotId = `${p.id}_${date}_${h.replace(":", "")}`;
                    const taken = bookings.find(b => b.id === slotId);
                    if (taken) {
                        const matchedU = users.find(u => (u.uid || u.id) === taken.userId);
                        const uAvatar = taken.userPhoto || matchedU?.photo || matchedU?.googlePhoto || `https://ui-avatars.com/api/?name=${encodeURIComponent(taken.userName || "Uye")}&background=10b981&color=020617`;
                        const dispName = taken.userNickname || matchedU?.nickname || taken.userName || "Üye";
                        return `
                            <button onclick="cancelBookingByManager('${taken.id}')" class="h-14 w-full rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/40 text-rose-700 dark:text-rose-200 text-[10px] font-bold px-1.5 flex items-center gap-1.5 leading-tight transition">
                                <img src="${uAvatar}" class="w-6 h-6 rounded-full object-cover border border-rose-400 shrink-0">
                                <span class="truncate text-left"><b>${h}</b><br>${dispName}</span>
                            </button>
                        `;
                    }
                    return `
                        <button onclick="openManagerCreateBookingModal('${p.id}', '${date}', '${h}')" class="h-14 w-full rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-emerald-500/20 text-slate-700 dark:text-slate-200 text-xs font-bold flex flex-col items-center justify-center leading-tight transition">
                            <span>${h}</span>
                            <span class="text-[9px] text-emerald-600 dark:text-emerald-400">+ Al</span>
                        </button>
                    `;
                }).join("");
                return `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden space-y-3 pb-4">
                        <img src="${photo}" onclick="openPhotoPreview(this.src)" class="w-full h-48 object-cover cursor-pointer">
                        <div class="px-4 flex items-start justify-between gap-2">
                            <div>
                                <h3 class="font-extrabold text-sm"><i class="fa-solid fa-futbol mr-1.5 text-emerald-500"></i>${p.name}</h3>
                                <p class="text-xs text-slate-500">${p.district} • <span class="font-bold text-emerald-500">${Number(p.price || 0).toLocaleString("tr-TR")} ₺</span></p>
                            </div>
                            <button onclick="openDrawerTab('my_pitches'); editOwnedPitch('${p.id}')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-bold"><i class="fa-solid fa-pen mr-1"></i>Düzenle</button>
                        </div>
                        <div class="px-4 grid grid-cols-4 gap-2">${btns}</div>
                    </div>
                `;
            }).join("");
            renderBookingsList();
        };

        async function checkManager(email, existing) {
            if (!email) return false;
            if (existing?.role === "manager" || email === FOUNDER_EMAIL.toLowerCase()) return true;
            try {
                const snap = await getDoc(doc(db, ALLOWED_MANAGERS_COLLECTION, encodeURIComponent(email)));
                if (snap.exists() && snap.data()?.active !== false) return true;
            } catch (_) {}
            return false;
        }

        function attachListeners() {
            unsubs.forEach(fn => { try { fn(); } catch (_) {} });
            unsubs = [];

            unsubs.push(onSnapshot(collection(db, "pitches"), (snap) => {
                allPitches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                recomputeOwned();
                renderAll();
                renderOwnedPitchesList();
                updateNotifBadge();
            }, () => {}));

            unsubs.push(onSnapshot(collection(db, "bookings"), (snap) => {
                allBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                recomputeOwned();
                renderAll();
            }, () => {}));

            unsubs.push(onSnapshot(collection(db, "users"), (snap) => {
                users = snap.docs.map(d => ({ id: d.id, uid: d.id, ...d.data() }));
                renderVerifyMembersList();
                renderAll();
            }, () => {}));

            unsubs.push(onSnapshot(collection(db, "notifications"), (snap) => {
                notifications = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateNotifBadge();
                renderManagerNotifications();
            }, () => {}));
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace(LOGIN_PAGE);
                return;
            }
            const email = (user.email || "").trim().toLowerCase();
            let existing = {};
            try {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) existing = snap.data() || {};
            } catch (_) {}

            if (existing.deleted === true || existing.blocked === true) {
                await signOut(auth);
                window.location.replace(LOGIN_PAGE);
                return;
            }

            const ok = await checkManager(email, existing);
            if (!ok) {
                document.getElementById("manager-guard-title").textContent = "Yetkisiz Erişim";
                document.getElementById("manager-guard-message").textContent = "İşletme yetkiniz bulunmuyor.";
                await signOut(auth);
                setTimeout(() => window.location.replace(LOGIN_PAGE), 800);
                return;
            }

            currentUser = {
                uid: user.uid,
                name: existing.name || user.displayName || email.split("@")[0] || "Saha Sahibi",
                email,
                phone: existing.phone || "",
                isManager: true
            };
            document.getElementById("header-name").textContent = currentUser.name;
            document.getElementById("menu-name").textContent = currentUser.name;
            document.getElementById("menu-email").textContent = currentUser.email;
            document.getElementById("prof-name").value = currentUser.name;
            document.getElementById("prof-phone").value = currentUser.phone;
            document.getElementById("manager-guard-screen").classList.add("hidden");
            attachListeners();
        });

        window.logout = async () => {
            try { await signOut(auth); } catch (_) {}
            window.location.replace(LOGIN_PAGE);
        };
    </script>
</body>
</html>
