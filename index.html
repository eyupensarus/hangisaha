<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangi Saha - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[360px] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-emerald-500"></div>

        <!-- Marka -->
        <div class="text-center space-y-2 mb-7">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 mb-1">
                <i class="fa-solid fa-futbol text-xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">
                HANGİ <span class="text-emerald-500">SAHA</span>
            </h1>
        </div>

        <!-- Hata Bildirimi -->
        <div id="error-box" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-300 text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation shrink-0"></i>
            <span id="error-text"></span>
        </div>

        <!-- Yönlendirme Durumu -->
        <div id="redirect-box" class="hidden py-3 text-center text-xs font-bold text-emerald-600 dark:text-emerald-400">
            <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Yönlendiriliyor...
        </div>

        <!-- Google ile Giriş -->
        <button type="button" id="google-login-btn" onclick="loginWithGoogle()" class="w-full py-3.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-100 text-white dark:text-slate-900 font-bold text-sm transition flex items-center justify-center gap-3 shadow-sm">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
                <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                <path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.4C.6 9.4 0 11.6 0 14s.6 4.6 1.6 6.6l3.7-2.8z"/>
                <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 20.4 7.4 23 12 23z"/>
            </svg>
            <span>Google ile Giriş Yap</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import {
            getAnalytics,
            isSupported
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

        const FOUNDER_EMAIL = "eyupensarus@gmail.com";
        const PAGES = {
            founder: "ana-sayfa-kurucu.html",
            manager: "ana-sayfa-isletme.html",
            user: "ana-sayfa.html"
        };

        const firebaseConfig = {
            apiKey: "AIzaSyB1-9hGJqxAwfGhLMDAdlkG9PcuojxP0ag",
            authDomain: "hangi-saha.firebaseapp.com",
            projectId: "hangi-saha",
            storageBucket: "hangi-saha.firebasestorage.app",
            messagingSenderId: "155728012356",
            appId: "1:155728012356:web:3b04ae7d8bd6f0f607c811",
            measurementId: "G-STXB4852BF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        isSupported().then((supported) => {
            if (supported) {
                getAnalytics(app);
            }
        }).catch(() => {});

        let routing = false;

        function setUiRedirecting(isRedirecting) {
            const btn = document.getElementById("google-login-btn");
            const redirectBox = document.getElementById("redirect-box");
            if (isRedirecting) {
                btn.classList.add("hidden");
                redirectBox.classList.remove("hidden");
            } else {
                btn.disabled = false;
                btn.classList.remove("hidden", "opacity-70");
                redirectBox.classList.add("hidden");
            }
        }

        function showError(msg) {
            document.getElementById("error-text").textContent = msg;
            document.getElementById("error-box").classList.remove("hidden");
        }

        function clearError() {
            document.getElementById("error-text").textContent = "";
            document.getElementById("error-box").classList.add("hidden");
        }

        async function routeUserByRole(user) {
            if (!user || routing) return;
            routing = true;
            setUiRedirecting(true);

            try {
                const googleInfo = Array.isArray(user.providerData)
                    ? user.providerData.find(p => p && p.providerId === "google.com")
                    : null;
                const email = ((googleInfo && googleInfo.email) || user.email || "").toLowerCase();
                const displayName = (googleInfo && googleInfo.displayName) || user.displayName || (email ? email.split("@")[0] : "Üye");
                const photoURL = (googleInfo && googleInfo.photoURL) || user.photoURL || "";

                let existing = {};
                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if (userSnap.exists()) {
                        existing = userSnap.data() || {};
                    } else {
                        const archSnap = await getDoc(doc(db, "archived_users", user.uid));
                        if (archSnap.exists()) existing = archSnap.data() || {};
                    }
                } catch (readErr) {
                    console.warn("Kullanıcı kaydı okunamadı:", readErr);
                }

                let role = "user";
                if (email === FOUNDER_EMAIL.toLowerCase() || existing.role === "founder") {
                    role = "founder";
                } else if (existing.role === "manager" || existing.role === "owner") {
                    role = "manager";
                }

                try {
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        name: existing.name || displayName,
                        email,
                        photo: existing.photo || photoURL,
                        googlePhoto: photoURL,
                        role,
                        lastLoginAt: Date.now()
                    }, { merge: true });
                } catch (writeErr) {
                    console.warn("Kullanıcı kaydı yazılamadı:", writeErr);
                }

                window.location.replace(PAGES[role] || PAGES.user);
            } catch (err) {
                console.error("Yönlendirme hatası:", err);
                routing = false;
                setUiRedirecting(false);
                showError("Oturum yönlendirmesi tamamlanamadı.");
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                routeUserByRole(user);
            }
        });

        window.loginWithGoogle = async () => {
            if (routing) return;
            clearError();
            const btn = document.getElementById("google-login-btn");
            btn.disabled = true;
            btn.classList.add("opacity-70");

            try {
                const result = await signInWithPopup(auth, provider);
                await routeUserByRole(result.user);
            } catch (err) {
                console.error("Google giriş hatası:", err);
                routing = false;
                setUiRedirecting(false);
                const code = err?.code || "";
                if (code === "auth/popup-closed-by-user") {
                    showError("Giriş penceresi kapatıldı.");
                } else if (code === "auth/popup-blocked") {
                    showError("Açılır pencere engellendi. İzin verip tekrar deneyin.");
                } else if (code === "auth/unauthorized-domain") {
                    showError("Bu alan adı Firebase'de yetkili değil.");
                } else {
                    showError("Giriş başarısız.");
                }
            }
        };
    </script>
</body>
</html>
