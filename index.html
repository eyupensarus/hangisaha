<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Oyna - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.16) 0%, transparent 55%),
                linear-gradient(to right, rgba(30, 41, 59, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.25) 1px, transparent 1px);
            background-size: 100% 100%, 36px 36px, 36px 36px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-slate-950">

    <!-- Ana Kart -->
    <div class="w-full max-w-[380px] bg-slate-900/90 backdrop-blur-xl border border-slate-800/90 rounded-3xl p-8 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] relative overflow-hidden">
        
        <!-- Üst İnce Neon Vurgu Çizgisi -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-emerald-400 to-transparent opacity-80"></div>

        <!-- Logo & Başlık -->
        <div class="text-center space-y-2.5 mb-7">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 mb-1 shadow-inner">
                <i class="fa-regular fa-futbol text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">
                TOP <span class="text-emerald-400">OYNA</span>
            </h1>
            <p class="text-xs text-slate-400">
                Devam etmek için Google hesabınla giriş yap.
            </p>
        </div>

        <!-- Hata Bildirim Kutusu -->
        <div id="error-box" class="hidden mb-5 p-3.5 rounded-xl bg-rose-950/70 border border-rose-500/40 text-rose-200 text-xs flex items-start gap-2.5">
            <i class="fa-solid fa-circle-exclamation text-rose-400 mt-0.5 shrink-0"></i>
            <span id="error-text"></span>
        </div>

        <!-- Google ile Giriş -->
        <button type="button" id="google-login-btn" onclick="loginWithGoogle()" class="w-full py-3.5 px-4 rounded-xl bg-white hover:bg-slate-100 active:scale-[0.99] text-slate-900 font-bold text-sm transition-all flex items-center justify-center gap-3 shadow-lg">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
                <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                <path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.4C.6 9.4 0 11.6 0 14s.6 4.6 1.6 6.6l3.7-2.8z"/>
                <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 20.4 7.4 23 12 23z"/>
            </svg>
            <span>Google ile Devam Et</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const TARGET_PAGE = "ana-sayfa2.html";

        const firebaseConfig = {
            apiKey: "AIzaSyCKYARoGK8ADJ2_T5c2GomrAG47-gHtQ-8",
            authDomain: "top-oyna-d33f3.firebaseapp.com",
            projectId: "top-oyna-d33f3",
            storageBucket: "top-oyna-d33f3.firebasestorage.app",
            messagingSenderId: "1033043310464",
            appId: "1:1033043310464:web:d467e84b68f73e99f0f365",
            measurementId: "G-P2ZRQQFFMD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        let navigating = false;

        function getFriendlyError(err) {
            const code = err?.code || "";
            if (code === "auth/popup-closed-by-user") {
                return "Giriş penceresi kapatıldı.";
            }
            if (code === "auth/popup-blocked") {
                return "Tarayıcı açılır pencereyi engelledi. Lütfen izin verip tekrar dene.";
            }
            return "Giriş yapılamadı: " + (err?.message || "Bilinmeyen hata");
        }

        function showError(msg) {
            const box = document.getElementById("error-box");
            document.getElementById("error-text").textContent = msg;
            box.classList.remove("hidden");
        }

        function clearError() {
            document.getElementById("error-text").textContent = "";
            document.getElementById("error-box").classList.add("hidden");
        }

        onAuthStateChanged(auth, (user) => {
            if (user && !navigating) {
                navigating = true;
                window.location.replace(TARGET_PAGE);
            }
        });

        window.loginWithGoogle = async () => {
            clearError();
            const btn = document.getElementById("google-login-btn");
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-emerald-600"></i> <span>Bağlanılıyor...</span>`;

            try {
                navigating = true;
                await signInWithPopup(auth, provider);
                window.location.replace(TARGET_PAGE);
            } catch (err) {
                navigating = false;
                btn.disabled = false;
                btn.innerHTML = originalHTML;
                showError(getFriendlyError(err));
            }
        };
    </script>
</body>
</html>
