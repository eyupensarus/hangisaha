<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Top Oyna Konya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        sport: ['Oswald', 'sans-serif'],
                    },
                    colors: {
                        pitch: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Arka Plan Efekti -->
    <div class="fixed inset-0 pointer-events-none flex items-center justify-center opacity-10">
        <div class="w-[500px] h-[500px] bg-pitch-500 rounded-full blur-[150px]"></div>
    </div>

    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl relative z-10">

        <!-- Logo ve Başlık -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-pitch-600 to-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-pitch-500/30">
                <i class="fa-solid fa-futbol text-2xl text-slate-950"></i>
            </div>
            <h1 class="font-sport text-3xl font-bold tracking-wider uppercase text-white">TOP <span class="text-pitch-500">OYNA</span></h1>
            <p class="text-xs text-slate-400 mt-1">Konya Halı Saha Rezervasyon Platformu</p>
        </div>

        <!-- Bildirim Mesajı -->
        <div id="statusBox" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border"></div>

        <!-- Google ile Giriş -->
        <button type="button" id="googleLoginBtn" class="w-full py-3 px-4 bg-white hover:bg-slate-100 text-slate-900 font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-3 text-sm mb-6">
            <i class="fa-brands fa-google text-red-500 text-lg"></i>
            <span>Google ile Devam Et</span>
        </button>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase">veya</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Standart Giriş Formu -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">E-posta veya Kullanıcı Adı</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input type="text" id="loginUser" required placeholder="ornek@mail.com" class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-pitch-500 outline-none transition text-white">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-semibold text-slate-400">Şifre</label>
                    <a href="sifre-sifirlama.html" class="text-xs text-pitch-400 hover:underline font-medium">Şifremi Unuttum?</a>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input type="password" id="loginPass" required placeholder="••••••••" class="w-full pl-11 pr-11 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-pitch-500 outline-none transition text-white">
                    <button type="button" id="togglePass" aria-label="Şifreyi göster veya gizle" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300 text-sm">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-pitch-600 hover:bg-pitch-500 text-slate-950 font-extrabold rounded-xl shadow-lg shadow-pitch-500/25 transition mt-2 text-sm">
                Giriş Yap
            </button>
        </form>

        <!-- Kayıt Ol Linki -->
        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <span class="text-xs text-slate-400">Hesabınız yok mu? </span>
            <a href="kayit-ol.html" class="text-xs text-pitch-400 font-bold hover:underline">Hemen Kayıt Olun</a>
        </div>

    </div>

    <script>
        const statusBox = document.getElementById('statusBox');
        const togglePassBtn = document.getElementById('togglePass');
        const passInput = document.getElementById('loginPass');
        const googleBtn = document.getElementById('googleLoginBtn');
        const loginForm = document.getElementById('loginForm');

        // Giriş sonrası yönlendirilecek sayfa adını kendi ana sayfa dosyanla eşleştirebilirsin
        const NEXT_PAGE = 'ana-sayfa.html';

        function showStatus(message, type = 'info') {
            statusBox.classList.remove('hidden', 'bg-emerald-950/60', 'text-emerald-300', 'border-emerald-800', 'bg-amber-950/60', 'text-amber-300', 'border-amber-800');
            if (type === 'success') {
                statusBox.classList.add('bg-emerald-950/60', 'text-emerald-300', 'border-emerald-800');
            } else {
                statusBox.classList.add('bg-amber-950/60', 'text-amber-300', 'border-amber-800');
            }
            statusBox.textContent = message;
        }

        togglePassBtn.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            togglePassBtn.innerHTML = isPassword
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';
        });

        googleBtn.addEventListener('click', () => {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(() => { window.location.href = 'ana-sayfa.html'; });
            // Firebase Auth Google signInWithPopup/signInWithRedirect eklenecek nokta
            window.location.href = NEXT_PAGE;

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userVal = document.getElementById('loginUser').value.trim();
            if (!userVal) return;

            showStatus(`Giriş doğrulandı (${userVal}). Yönlendiriliyor...`, 'success');
            setTimeout(() => {
                // Hedef sayfa varsa yönlendirir; yoksa aynı sayfada kalır
                if (window.location.pathname.endsWith('/' + NEXT_PAGE)) return;
                window.location.href = NEXT_PAGE;
            }, 600);
        });
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCKYARoGK8ADJ2_T5c2GomrAG47-gHtQ-8",
  authDomain: "top-oyna-d33f3.firebaseapp.com",
  projectId: "top-oyna-d33f3",
  storageBucket: "top-oyna-d33f3.firebasestorage.app",
  messagingSenderId: "1033043310464",
  appId: "1:1033043310464:web:d467e84b68f73e99f0f365",
  measurementId: "G-P2ZRQQFFMD"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    </script>
</body>
</html>
