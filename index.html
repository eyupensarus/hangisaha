<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Oyna - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 shadow-2xl">
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-extrabold text-emerald-400 tracking-wide">TOP OYNA</h1>
            <p class="text-xs text-slate-400">Google hesabın veya e-posta şifrenle giriş yap</p>
        </div>

        <div id="error-box" class="hidden p-3 rounded-xl bg-rose-950/60 border border-rose-500/40 text-rose-200 text-xs"></div>

        <!-- GOOGLE İLE GİRİŞ -->
        <button type="button" id="google-login-btn" onclick="loginWithGoogle()" class="w-full py-2.5 px-4 rounded-xl bg-white hover:bg-slate-100 text-slate-900 font-bold text-sm transition flex items-center justify-center gap-2.5 shadow">
            <i class="fa-brands fa-google text-rose-500 text-base"></i>
            <span>Google ile Giriş Yap</span>
        </button>

        <div class="relative flex items-center justify-center text-[11px] text-slate-500">
            <span class="border-t border-slate-800 w-full"></span>
            <span class="px-3 bg-slate-900 shrink-0">veya</span>
            <span class="border-t border-slate-800 w-full"></span>
        </div>

        <!-- E-POSTA / ŞİFRE GİRİŞİ VE KAYIT -->
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
            <input type="email" id="email" required placeholder="E-posta adresi" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            <input type="password" id="password" required minlength="6" placeholder="Şifre (en az 6 karakter)" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            <button type="submit" id="submit-btn" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm transition">
                Giriş Yap
            </button>
        </form>

        <!-- GOOGLE HESABINA ŞİFRE BELİRLEME PANELİ -->
        <form id="link-password-box" onsubmit="handleLinkPassword(event)" class="hidden p-4 rounded-xl bg-slate-950 border border-emerald-500/40 space-y-3">
            <div class="space-y-1">
                <p class="text-xs font-bold text-emerald-400">E-posta ve şifreyle giriş için şifre belirle</p>
                <p id="link-email-info" class="text-[11px] text-slate-400"></p>
            </div>
            <input type="password" id="new-password" required minlength="6" placeholder="Yeni uygulama şifresi (en az 6 karakter)" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-emerald-500">
            <div class="flex gap-2">
                <button type="submit" id="link-submit-btn" class="flex-1 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs transition">
                    Şifreyi Bağla ve Devam Et
                </button>
                <button type="button" onclick="skipLinkPassword()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
                    Şimdilik Geç
                </button>
            </div>
        </form>

        <div class="text-center">
            <button type="button" id="mode-toggle" onclick="toggleMode()" class="text-xs text-emerald-400 hover:text-emerald-300 font-semibold">
                Hesabın yok mu? Kayıt Ol
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            GoogleAuthProvider,
            EmailAuthProvider,
            signInWithPopup,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            linkWithCredential
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKYARoGK8ADJ2_T5c2GomrAG47-gHtQ-8",
            authDomain: "top-oyna-d33f3.firebaseapp.com",
            projectId: "top-oyna-d33f3",
            storageBucket: "top-oyna-d33f3.firebasestorage.app",
            messagingSenderId: "1033043310464",
            appId: "1:1033043310464:web:d467e84b68f73e99f0f365",
            measurementId: "G-P2ZRQQFFMD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let isRegister = false;
        let navigating = false;
        let pendingGoogleUser = null;

        function goHome() {
            if (!navigating) {
                navigating = true;
                window.location.replace("anasayfa.html");
            }
        }

        function showError(msg) {
            const box = document.getElementById("error-box");
            box.textContent = msg;
            box.classList.remove("hidden");
        }

        function clearError() {
            const box = document.getElementById("error-box");
            box.textContent = "";
            box.classList.add("hidden");
        }

        function hasPasswordProvider(user) {
            return Boolean(user?.providerData?.some((p) => p.providerId === "password"));
        }

        function resetSubmitButton() {
            const btn = document.getElementById("submit-btn");
            btn.disabled = false;
            btn.textContent = isRegister ? "Kayıt Ol" : "Giriş Yap";
        }

        function getFriendlyError(err) {
            switch (err?.code) {
                case "auth/operation-not-allowed":
                    return "Bu giriş yöntemi Firebase konsolunda henüz aktif değil.";
                case "auth/weak-password":
                    return "Şifre en az 6 karakter olmalıdır.";
                case "auth/popup-closed-by-user":
                    return "Google giriş penceresi kapatıldı.";
                default:
                    return err?.message || "İşlem sırasında bir hata oluştu.";
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user && !pendingGoogleUser && !navigating) {
                goHome();
            }
        });

        window.loginWithGoogle = async (hintEmail = "") => {
            clearError();
            const btn = document.getElementById("google-login-btn");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Google'a bağlanılıyor...</span>`;

            if (hintEmail) {
                provider.setCustomParameters({ login_hint: hintEmail });
            } else {
                provider.setCustomParameters({});
            }

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                if (user?.email && !hasPasswordProvider(user)) {
                    pendingGoogleUser = user;
                    document.getElementById("link-email-info").textContent = `${user.email} hesabı için sonradan şifreyle de girebilmek adına bir şifre belirleyebilirsin.`;
                    document.getElementById("link-password-box").classList.remove("hidden");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-brands fa-google text-rose-500 text-base"></i> <span>Google ile Giriş Yap</span>`;
                    resetSubmitButton();
                    return;
                }

                goHome();
            } catch (err) {
                navigating = false;
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-brands fa-google text-rose-500 text-base"></i> <span>Google ile Giriş Yap</span>`;
                resetSubmitButton();
                showError("Google girişi tamamlanamadı: " + getFriendlyError(err));
            }
        };

        window.handleLinkPassword = async (e) => {
            e.preventDefault();
            clearError();
            if (!pendingGoogleUser?.email) return;

            const newPassword = document.getElementById("new-password").value;
            const linkBtn = document.getElementById("link-submit-btn");
            linkBtn.disabled = true;
            linkBtn.textContent = "Bağlanıyor...";

            try {
                const credential = EmailAuthProvider.credential(pendingGoogleUser.email, newPassword);
                await linkWithCredential(pendingGoogleUser, credential);
                pendingGoogleUser = null;
                goHome();
            } catch (err) {
                linkBtn.disabled = false;
                linkBtn.textContent = "Şifreyi Bağla ve Devam Et";
                showError("Şifre bağlanamadı: " + getFriendlyError(err));
            }
        };

        window.skipLinkPassword = () => {
            pendingGoogleUser = null;
            document.getElementById("link-password-box").classList.add("hidden");
            goHome();
        };

        window.toggleMode = () => {
            clearError();
            isRegister = !isRegister;
            document.getElementById("submit-btn").textContent = isRegister ? "Kayıt Ol" : "Giriş Yap";
            document.getElementById("mode-toggle").textContent = isRegister ? "Zaten hesabın var mı? Giriş Yap" : "Hesabın yok mu? Kayıt Ol";
        };

        window.handleAuth = async (e) => {
            e.preventDefault();
            clearError();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("submit-btn");

            btn.disabled = true;
            btn.textContent = "İşleniyor...";

            try {
                if (isRegister) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                goHome();
            } catch (err) {
                navigating = false;

                // Hesap Google ile açılmışsa veya şifre/kayıt çakışması varsa uyarı vermek yerine doğrudan Google girişini başlat
                const fallbackCodes = [
                    "auth/email-already-in-use",
                    "auth/invalid-credential",
                    "auth/wrong-password",
                    "auth/user-not-found"
                ];

                if (fallbackCodes.includes(err?.code)) {
                    await window.loginWithGoogle(email);
                    return;
                }

                resetSubmitButton();
                showError(getFriendlyError(err));
            }
        };
    </script>
</body>
</html>
