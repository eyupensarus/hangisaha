<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Top Oyna Konya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        sport: ['Oswald', 'sans-serif'],
                    },
                    colors: {
                        pitch: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">
    
    <!-- Arka Plan Efekti -->
    <div class="fixed inset-0 pointer-events-none flex items-center justify-center opacity-10">
        <div class="w-[500px] h-[500px] bg-pitch-500 rounded-full blur-[150px]"></div>
    </div>

    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl relative z-10 my-6">
        
        <!-- Logo ve Başlık -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-pitch-600 to-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-pitch-500/30">
                <i class="fa-solid fa-futbol text-2xl text-slate-950"></i>
            </div>
            <h1 class="font-sport text-3xl font-bold tracking-wider uppercase text-white">TOP <span class="text-pitch-500">OYNA</span></h1>
            <p class="text-xs text-slate-400 mt-1">Yeni Hesap Oluştur</p>
        </div>

        <!-- Bildirim Mesajı (Hata / Başarı) -->
        <div id="statusBox" class="hidden mb-4 p-3 rounded-xl text-xs font-medium text-center border"></div>

        <!-- Google ile Hızlı Kayıt -->
        <button type="button" onclick="alert('Google ile kayıt tetiklendi!')" class="w-full py-3 px-4 bg-white hover:bg-slate-100 text-slate-900 font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-3 text-sm mb-5">
            <i class="fa-brands fa-google text-red-500 text-lg"></i>
            <span>Google ile Kayıt Ol</span>
        </button>

        <div class="relative flex py-2 items-center mb-5">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase">veya e-posta ile</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Kayıt Formu -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Ad Soyad</label>
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input id="fullName" type="text" required placeholder="Adınız Soyadınız" class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-pitch-500 outline-none transition text-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">E-posta Adresi</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input id="email" type="email" required placeholder="ornek@mail.com" class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-pitch-500 outline-none transition text-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Telefon Numarası</label>
                <div class="relative">
                    <i class="fa-solid fa-phone absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input id="phone" type="tel" required placeholder="05XX XXX XX XX" class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-pitch-500 outline-none transition text-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Şifre</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input id="password" type="password" required minlength="6" placeholder="En az 6 karakter" class="w-full pl-11 pr-11 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-pitch-500 outline-none transition text-white">
                    <button type="button" id="togglePassBtn" class="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300 text-sm">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Şifre Tekrar</label>
                <div class="relative">
                    <i class="fa-solid fa-shield-halved absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <input id="passwordConfirm" type="password" required minlength="6" placeholder="Şifrenizi tekrar girin" class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-pitch-500 outline-none transition text-white">
                </div>
            </div>

            <!-- Kullanım Koşulları -->
            <div class="flex items-start gap-2.5 pt-1">
                <input id="terms" type="checkbox" required class="mt-0.5 w-4 h-4 accent-pitch-500 rounded bg-slate-950 border-slate-800">
                <label for="terms" class="text-xs text-slate-400 leading-relaxed">
                    <span class="text-slate-200 font-medium">Kullanım Koşulları</span> ve <span class="text-slate-200 font-medium">Gizlilik Politikası</span>'nı okudum, kabul ediyorum.
                </label>
            </div>

            <button type="submit" class="w-full py-3.5 bg-pitch-600 hover:bg-pitch-500 text-slate-950 font-extrabold rounded-xl shadow-lg shadow-pitch-500/25 transition mt-2 text-sm">
                Kayıt Ol
            </button>
        </form>

        <!-- Giriş Yap Linki -->
        <div class="mt-6 pt-5 border-t border-slate-800 text-center">
            <span class="text-xs text-slate-400">Zaten hesabınız var mı? </span>
            <a href="index.html" class="text-xs text-pitch-400 font-bold hover:underline">Giriş Yapın</a>
        </div>

    </div>

    <script>
        const statusBox = document.getElementById('statusBox');
        const togglePassBtn = document.getElementById('togglePassBtn');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        const registerForm = document.getElementById('registerForm');

        function showStatus(message, type = 'error') {
            statusBox.classList.remove('hidden', 'bg-emerald-950/60', 'text-emerald-300', 'border-emerald-800', 'bg-red-950/60', 'text-red-300', 'border-red-800');
            if (type === 'success') {
                statusBox.classList.add('bg-emerald-950/60', 'text-emerald-300', 'border-emerald-800');
            } else {
                statusBox.classList.add('bg-red-950/60', 'text-red-300', 'border-red-800');
            }
            statusBox.textContent = message;
        }

        // Şifre göster/gizle
        togglePassBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            passwordConfirmInput.type = isPassword ? 'text' : 'password';
            togglePassBtn.innerHTML = isPassword
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';
        });

        // Form gönderimi ve şifre eşleşme kontrolü
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('fullName').value.trim();
            
            if (passwordInput.value !== passwordConfirmInput.value) {
                showStatus('Girdiğiniz şifreler birbiriyle eşleşmiyor!', 'error');
                return;
            }

            showStatus(`Hoş geldin ${name}! Kaydın tamamlandı, giriş sayfasına yönlendiriliyorsun...`, 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        });
    </script>
</body>
</html>
